<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#ffffff" stroke-width="1">
    <path d="M760 60 L1100 60 M760 120 L1100 120 M760 180 L1100 180 M760 240 L1100 240 M760 300 L1100 300"/>
  </g>
  <!-- 三层结构示意：主 bot → 分 bot → 对话 -->
  <g transform="translate(820,70)">
    <line x1="140" y1="40" x2="50" y2="110" stroke="#a78bfa" stroke-width="3"/>
    <line x1="140" y1="40" x2="230" y2="110" stroke="#a78bfa" stroke-width="3"/>
    <line x1="50" y1="130" x2="10" y2="200" stroke="#38bdf8" stroke-width="2"/>
    <line x1="50" y1="130" x2="90" y2="200" stroke="#38bdf8" stroke-width="2"/>
    <line x1="230" y1="130" x2="190" y2="200" stroke="#38bdf8" stroke-width="2"/>
    <line x1="230" y1="130" x2="270" y2="200" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="140" cy="30" r="26" fill="url(#mark)"/>
    <circle cx="50" cy="120" r="18" fill="#a78bfa"/>
    <circle cx="230" cy="120" r="18" fill="#a78bfa"/>
    <g fill="#38bdf8">
      <rect x="-4" y="200" width="28" height="20" rx="6"/>
      <rect x="76" y="200" width="28" height="20" rx="6"/>
      <rect x="176" y="200" width="28" height="20" rx="6"/>
      <rect x="256" y="200" width="28" height="20" rx="6"/>
    </g>
  </g>
  <text x="80" y="160" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="88" font-weight="800" fill="#ffffff">Kiki</text>
  <text x="300" y="160" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="44" font-weight="600" fill="#c4b5fd">奇奇</text>
  <text x="82" y="222" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="30" fill="#e2e8f0">跑在你自己 Mac 上的开源个人 AI 助理</text>
  <text x="82" y="270" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" fill="#94a3b8">一个收件箱 · 多个专属 Bot · 无限具名对话 · 数据永远留在本地</text>
