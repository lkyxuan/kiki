<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiki</title>
<!-- 装成 App：Mac 上 Safari「文件 → 添加到程序坞」，iPhone 上「分享 → 添加到主屏幕」 -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kiki">
<style>
  :root {
    --bg: #ffffff; --side: #f6f6f4; --line: #e6e5e1; --text: #1d1d1b; --muted: #6f6e69;
    --hover: #ecebe7; --active: #e2e1dc; --me: #1d1d1b; --me-text: #ffffff; --accent: #5b6cf0; --code: #f3f2ee;
    --card: #ffffff; --ok: #1f7a3a; --busy: #2f5fc4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1b1d; --side: #141416; --line: #2c2c30; --text: #ececec; --muted: #9b9ba2;
      --hover: #222226; --active: #2b2b31; --me: #ececec; --me-text: #1b1b1d; --accent: #8b97ff; --code: #26262b;
      --card: #202023; --ok: #6fd18e; --busy: #8fb0ff;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); display: flex;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  svg.i { width: 16px; height: 16px; flex: none; }

  /* 左栏：奇奇 + 我的宝 */
  aside { width: 256px; flex: none; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow: auto; padding: 14px 10px; }
  .item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; min-height: 36px; padding: 6px 10px; border-radius: 8px; white-space: nowrap; overflow: hidden; }
  .item:hover { background: var(--hover); }
  .item.on { background: var(--active); font-weight: 500; }
  .item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  /* 奇奇主按钮：和对话条目不一样，居中、大图标 */
  .kiki { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; padding: 18px 10px 14px; border-radius: 14px; font-weight: 650; font-size: 16px; }
  .kiki .ava { display: block; width: 72px; height: 72px; border-radius: 50%; overflow: hidden; transition: transform .15s; }
  .kiki .ava img, .kiki .ava svg { display: block; width: 100%; height: 100%; }
  .kiki:hover { background: var(--hover); }
  .kiki:hover .ava { transform: scale(1.04); }
  .kiki.on { background: var(--active); }
  .kiki.on .ava { box-shadow: 0 0 0 3px var(--side), 0 0 0 5px var(--accent); }
  .qiqi-ava .iris { transition: transform .35s ease-out; } /* 奇奇转眼珠，见 public/qiqi-eyes.js */
  .kiki .dot { position: absolute; top: 18px; right: calc(50% - 40px); width: 10px; height: 10px; border: 2px solid var(--side); }
  .label { font-size: 12px; color: var(--muted); padding: 16px 10px 6px; letter-spacing: .04em; }
  .bao { margin-bottom: 4px; }
  .bao-head { display: flex; align-items: center; gap: 10px; padding: 6px 4px 6px 10px; font-size: 14px; font-weight: 500; }
  .sub-head { color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: .04em; padding-top: 10px; }
  #qiqi .sess { padding-left: 22px; }
  #qiqi .empty { padding-left: 22px; }
  .bao-head .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bao-head button { color: var(--muted); width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; }
  .bao-head button:hover { background: var(--hover); color: var(--text); }
  .avatar { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; color: #fff; }
  .sess { padding-left: 42px; font-size: 14px; min-height: 32px; }
  .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  .spin { width: 11px; height: 11px; border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: r .8s linear infinite; flex: none; }
  @keyframes r { to { transform: rotate(360deg); } }
  .new-input { margin: 2px 0 6px 42px; width: calc(100% - 42px); padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-size: 14px; }
  .new-bao-input { margin: 4px 0 6px; width: 100%; }
  .empty { color: var(--muted); font-size: 13px; padding: 2px 10px 4px 42px; }
  .add-bao { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .add-bao:hover { color: var(--text); }
  .settings { margin-top: auto; color: var(--text); text-decoration: none; font-size: 14px; }

  /* 中间：对话 */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { min-height: 52px; padding: 10px 16px 10px 24px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  #title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #title .crumb { color: var(--muted); font-weight: 400; }
  #upd { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  #upd:empty { display: none; }
  #upd button { color: #fff; background: var(--accent); border-radius: 6px; padding: 1px 8px; font-size: 12px; }
  .icon-btn { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); flex: none; }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  #panel-toggle { margin-left: auto; }
  #upd:not(:empty) + #panel-toggle { margin-left: 0; }
  #log { flex: 1; overflow: auto; padding: 24px; }
  .msgs { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .msg { white-space: normal; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--me); color: var(--me-text); padding: 9px 14px; border-radius: 16px 16px 4px 16px; max-width: 80%; white-space: pre-wrap; }
  .msg.assistant p { margin: 0 0 .6em; } .msg.assistant p:last-child { margin: 0; }
  .msg pre { background: var(--code); padding: 10px 12px; border-radius: 8px; overflow: auto; font-size: 13px; }
  .msg code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-size: 13px; }
  .msg pre code { background: none; padding: 0; }
  .msg a { color: var(--accent); }
  .pending { color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .hint { color: var(--muted); text-align: center; margin-top: 18vh; }
  /* 奇奇的回执卡片：发到哪个宝的哪段对话 */
  .receipt { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px 10px 14px; margin-bottom: 10px; max-width: 520px; }
  .receipt .where { flex: 1; min-width: 0; }
  .receipt .how { display: block; font-size: 12px; color: var(--muted); }
  .receipt b { font-weight: 600; }
  .receipt button { border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; font-size: 13px; background: var(--bg); }
  .receipt button:hover { background: var(--hover); }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .choices button { border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; text-align: left; font-size: 14px; }
  .choices button:hover { background: var(--hover); }
  /* 等你点头：收不回来的动作做之前先问一句，卡片在输入框上方 */
  #asks { padding: 0 24px; }
  #asks:empty { display: none; }
  .ask { max-width: 760px; margin: 0 auto 8px; border: 1px solid var(--accent); background: var(--card); border-radius: 12px; padding: 10px 12px 10px 14px; }
  .ask .what { font-size: 13px; color: var(--muted); }
  .ask .what b { color: var(--text); font-weight: 600; }
  .ask pre { margin: 6px 0 8px; background: var(--code); padding: 8px 10px; border-radius: 8px; overflow: auto; font-size: 13px; max-height: 160px; white-space: pre-wrap; word-break: break-all; }
  .ask .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .ask .btns button { border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; font-size: 13px; background: var(--bg); }
  .ask .btns button:hover { background: var(--hover); }
  .ask .btns button.yes { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ask .btns a { margin-left: auto; align-self: center; font-size: 13px; color: var(--accent); cursor: pointer; }
  .composer { padding: 12px 24px 20px; }
  .box { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 8px 14px; background: var(--bg); }
  textarea { flex: 1; border: 0; outline: 0; resize: none; background: none; color: var(--text); font: inherit; max-height: 200px; padding: 4px 0; }
  .send { background: var(--text); color: var(--bg); border-radius: 9px; padding: 0 14px; font-weight: 600; }
  .send:disabled { opacity: .35; cursor: default; }

  /* 右栏：进行中、后台任务、这个宝 */
  #panel { width: 300px; flex: none; border-left: 1px solid var(--line); background: var(--side); overflow: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 18px; }
  body.no-panel #panel { display: none; }
  #panel h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
  #panel .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  #panel .row { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
  #panel .row:first-child { border-top: 0; }
  #panel button.row:hover .name { text-decoration: underline; }
  #panel .row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #panel .row small { color: var(--muted); font-size: 12px; }
  #panel .none { color: var(--muted); font-size: 13px; }
  #panel .about { font-size: 13px; line-height: 1.6; color: var(--text); white-space: pre-wrap; max-height: 220px; overflow: hidden; }
  #panel a { color: var(--accent); font-size: 13px; text-decoration: none; }

  @media (max-width: 1100px) { #panel { display: none; } body.show-panel #panel { display: flex; position: fixed; right: 0; top: 0; bottom: 0; z-index: 5; box-shadow: -8px 0 24px rgba(0,0,0,.08); } }
  @media (max-width: 700px) { aside { width: 200px; } #log, .composer, #asks { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<aside>
  <button class="kiki" data-path="main" aria-label="奇奇"><span class="ava"><img src="/qiqi.png" alt=""></span><span class="name">奇奇</span></button>
  <div id="qiqi"></div>
  <div class="label" id="baos-label">我的宝</div>
  <div id="agents"></div>
  <button class="item add-bao" id="add-bao"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="name">新建一个宝</span></button>
  <a class="item settings" href="/settings.html"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="name">设置</span></a>
</aside>
<main>
  <header>
    <span id="title">奇奇</span>
    <span id="upd"></span>
    <button class="icon-btn" id="panel-toggle" aria-label="显示或隐藏右栏" title="右栏"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
  </header>
  <div id="log"><div class="msgs" id="msgs"></div></div>
  <div id="asks" aria-live="polite"></div>
  <div class="composer">
    <div class="box">
      <textarea id="input" rows="1" aria-label="消息" placeholder="说点什么… Enter 发送，Shift+Enter 换行"></textarea>
      <button class="send" id="send">发送</button>
    </div>
  </div>
</main>
<section id="panel" aria-label="右栏"></section>
<script>
const $ = (s) => document.querySelector(s);
let tree = { agents: [] };
let current = "main";
let streaming = null; // 当前对话正在流式输出的那条消息元素
const unread = new Set();
const DEFAULT_BAO = "奇奇"; // 默认的宝，和 src/migrate.ts 一致
const aboutCache = {}; // 宝名 -> AGENTS.md 开头几行
let asks = []; // 等你点头的卡片

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// 极简 Markdown：代码块、行内代码、粗体、链接、段落
function md(src) {
  const parts = src.split(/```(?:\w*)\n?([\s\S]*?)```/g);
  return parts.map((p, i) => {
    if (i % 2) return `<pre><code>${esc(p)}</code></pre>`;
    return esc(p).split(/\n{2,}/).filter((x) => x.trim()).map((para) =>
      "<p>" + para
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
        .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank">$1</a>')
        .replace(/\n/g, "<br>") + "</p>").join("");
  }).join("");
}

// 每个宝一个固定颜色（按名字算），头像显示名字第一个字
const COLORS = ["#3b6fd4", "#2f8a4e", "#b06a12", "#8a4fc2", "#c2465a", "#1f8a8a"];
function color(name) { let h = 0; for (const c of name) h = (h * 31 + c.codePointAt(0)) >>> 0; return COLORS[h % COLORS.length]; }
const avatar = (name) => `<span class="avatar" style="background:${color(name)}">${esc([...name][0].toUpperCase())}</span>`;
const PLUS = '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

function find(path) {
  for (const a of tree.agents) for (const s of a.sessions) if (s.path === path) return s;
}

function renderSide() {
  if (typeof thinkEyes === "function") thinkEyes();
  const k = $(".kiki");
  k.classList.toggle("on", current === "main");
  k.querySelector(".dot")?.remove();
  if (unread.has("main")) k.insertAdjacentHTML("beforeend", '<span class="dot"></span>');
  const sessRows = (a) => (a.sessions.length ? "" : '<div class="empty">还没有对话</div>') + a.sessions.map((s) => `
        <button class="item sess ${s.path === current ? "on" : ""}" data-path="${esc(s.path)}">
          <span class="name">${esc(s.name)}</span>
          ${s.background ? '<span class="tag">后台</span>' : ""}
          ${s.busy ? '<span class="spin"></span>' : unread.has(s.path) ? '<span class="dot"></span>' : ""}
        </button>`).join("");
  const newBtn = (name) => `<button title="在${esc(name)}里新开对话" aria-label="在${esc(name)}里新开对话" data-new="${esc(name)}">${PLUS}</button>`;
  // 奇奇是默认的宝：它的对话直接列在主按钮下面；别的宝都是从奇奇分出去的，列在“我的宝”
  const qiqi = tree.agents.find((a) => a.name === DEFAULT_BAO);
  $("#qiqi").innerHTML = qiqi ? `<div class="bao"><div class="bao-head sub-head"><span class="name">对话</span>${newBtn(qiqi.name)}</div>${sessRows(qiqi)}</div>` : "";
  const others = tree.agents.filter((a) => a.name !== DEFAULT_BAO);
  $("#baos-label").hidden = !others.length;
  $("#agents").innerHTML = others.map((a) => `
    <div class="bao">
      <div class="bao-head">${avatar(a.name)}<span class="name">${esc(a.name)}</span>${newBtn(a.name)}</div>
      ${sessRows(a)}
    </div>`).join("");
  renderPanel();
}

// 右栏：哪些对话在干活、后台任务、当前这个宝
function renderPanel() {
  const all = tree.agents.flatMap((a) => a.sessions);
  const row = (s) => `<button class="row" data-path="${esc(s.path)}">${s.busy ? '<span class="spin"></span>' : avatar(s.agent)}<span class="name">${esc(s.name)}</span><small>${esc(s.agent)}</small></button>`;
  const busy = all.filter((s) => s.busy);
  const bg = all.filter((s) => s.background).sort((x, y) => String(y.created).localeCompare(String(x.created))).slice(0, 8);
  let html = "";
  if (asks.length) html += `<div><h3>等你点头</h3><div class="card">${asks.map((a) => { const s = find(a.path); return `<button class="row" data-path="${esc(a.path)}">${avatar(a.agent)}<span class="name">${esc(a.categoryName)}</span><small>${esc(s ? s.name : a.agent)}</small></button>`; }).join("")}</div></div>`;
  html += `<div><h3>进行中</h3><div class="card">${busy.length ? busy.map(row).join("") : '<div class="none">现在没有在干活的对话</div>'}</div></div>`;
  html += `<div><h3>后台任务</h3><div class="card">${bg.length ? bg.map(row).join("") : '<div class="none">还没有后台任务</div>'}</div></div>`;
  const s = find(current);
  if (s) {
    const about = aboutCache[s.agent];
    html += `<div><h3>${esc(s.agent)}</h3><div class="card"><div class="about">${about === undefined ? "读取中…" : esc(about || "还没写说明")}</div><a href="/settings.html">编辑说明</a></div></div>`;
    if (about === undefined) loadAbout(s.agent);
  } else {
    html += `<div><h3>我的宝</h3><div class="card">${tree.agents.map((a) => `<div class="row">${avatar(a.name)}<span class="name">${esc(a.name)}</span><small>${a.sessions.length} 段对话</small></div>`).join("") || '<div class="none">还没有宝</div>'}</div></div>`;
  }
  $("#panel").innerHTML = html;
  renderAsks();
}
// 卡片：奇奇（收件箱）里显示全部，某段对话里只显示它自己的
function renderAsks() {
  const mine = current === "main" ? asks : asks.filter((a) => a.path === current);
  $("#asks").innerHTML = mine.map((a) => {
    const s = find(a.path);
    const where = s ? `${esc(a.agent)} › ${esc(s.name)}` : esc(a.agent);
    return `<div class="ask"><div class="what"><b>${esc(a.categoryName)}</b> · ${where} 想做这一步，同意吗？</div>
      <pre>${esc(a.detail)}</pre>
      <div class="btns"><button class="yes" data-decide="yes" data-id="${a.id}">同意</button><button data-decide="no" data-id="${a.id}">不同意</button><button data-decide="always" data-id="${a.id}" title="${esc(a.label)}">以后这类都同意</button>${current === "main" && s ? `<a data-path="${esc(a.path)}">打开对话</a>` : ""}</div></div>`;
  }).join("");
  // 奇奇按钮上的小点：有卡片在等
  const k = $(".kiki");
  if (asks.length && !k.querySelector(".dot")) k.insertAdjacentHTML("beforeend", '<span class="dot"></span>');
}
async function decide(id, decision) {
  const r = await fetch("/api/approvals/decide", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id, decision }) });
  if (!r.ok) { asks = asks.filter((a) => a.id !== id); renderSide(); }
}
async function loadAsks() {
  try { const r = await fetch("/api/approvals"); if (r.ok) asks = await r.json(); } catch {}
  renderSide();
}
async function loadAbout(name) {
  aboutCache[name] = "";
  try {
    const r = await fetch("/api/settings/agent?name=" + encodeURIComponent(name));
    if (r.ok) aboutCache[name] = (await r.json()).text.split("\n").map((l) => l.replace(/^#+\s*/, "")).filter((l) => l.trim()).slice(0, 8).join("\n");
  } catch {}
  renderPanel();
}

// 奇奇的回执："→ 奇奇/周报 · 接着聊" 第一行渲染成卡片；拿不准时的 "1. …" 渲染成按钮
function render(text) {
  const r = text.match(/^→ (\S+?)\/(.+?) · (\S+)\n\n([\s\S]*)$/);
  if (r) return `<div class="receipt">${avatar(r[1])}<span class="where"><span class="how">${esc(r[3])}</span><b>${esc(r[1])} › ${esc(r[2])}</b></span><button data-goto="${esc(r[1] + "/" + r[2])}">打开对话</button></div>` + md(r[4]);
  if (text.startsWith("🤔")) {
    const [head, ...opts] = text.split("\n");
    return md(head.replace(/^🤔\s*/, "")) + '<div class="choices">' + opts.map((o) => {
      const m = o.match(/^(\d+)\. (.+)$/);
      return m ? `<button data-choose="${m[1]}">${esc(m[2])}</button>` : "";
    }).join("") + "</div>";
  }
  return md(text);
}

function addMsg(role, text) {
  const el = document.createElement("div");
  el.className = `msg ${role}`;
  if (role === "user") el.textContent = text; else el.innerHTML = render(text);
  $("#msgs").appendChild(el);
  $("#log").scrollTop = $("#log").scrollHeight;
  return el;
}

async function open(path) {
  current = path;
  unread.delete(path);
  streaming = null;
  const s = find(path);
  $("#title").innerHTML = path === "main" ? "奇奇" : `<span class="crumb">${esc(s.agent)} › </span>${esc(s.name)}${s.background ? ' <span class="tag">后台</span>' : ""}`;
  document.body.classList.remove("show-panel");
  renderSide();
  const hist = await (await fetch(`/api/history?path=${encodeURIComponent(path)}`)).json();
  if (path !== current) return; // 连点两段对话时，先发的请求可能后回来，别把上一段的内容画到这一段
  $("#msgs").innerHTML = "";
  if (!hist.length) $("#msgs").innerHTML = path === "main"
    ? '<div class="hint">跟奇奇说就行，它会分给对应的宝。<br>@宝名 可以直接指定，/help 看命令。</div>'
    : '<div class="hint">新对话，说点什么吧。</div>';
  hist.forEach((m) => addMsg(m.role, m.text));
  if (s?.busy) setPending(true);
  $("#input").focus();
}

async function send() {
  const text = $("#input").value.trim();
  if (!text) return;
  $("#input").value = "";
  autosize();
  $(".hint")?.remove();
  const r = await fetch("/api/send", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ path: current, text }) });
  if (r.ok && current === "main") { setPending(true); mainBusy = true; thinkEyes(); } // 奇奇要先路由再回答，给个等待提示
  if (!r.ok) addMsg("assistant", `出错了：${(await r.json()).error}`);
}

// 左栏里的小输入框：回车确定，Esc 或点别处取消
function inlineInput(after, cls, placeholder, onEnter) {
  if (after.parentElement.querySelector("." + cls)) return;
  const input = document.createElement("input");
  input.className = cls;
  input.placeholder = placeholder;
  after.after(input);
  input.focus();
  input.onkeydown = async (e) => {
    if (e.key === "Escape") return input.remove();
    if (e.key !== "Enter" || e.isComposing || !input.value.trim()) return;
    const err = await onEnter(input.value.trim());
    if (err) { input.value = ""; input.placeholder = err; } else input.remove();
  };
  input.onblur = () => setTimeout(() => input.remove(), 150);
}

function newSession(agent, btn) {
  inlineInput(btn.closest(".bao-head"), "new-input", "对话名字，回车确定", async (name) => {
    const r = await fetch("/api/new", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ agent, name }) });
    const data = await r.json();
    if (!r.ok) return data.error;
    await loadTree();
    open(data.path);
  });
}

function newBao() {
  inlineInput($("#agents"), "new-input new-bao-input", "宝的名字，比如 work", async (name) => {
    const r = await fetch("/api/settings/agent", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name, create: true }) });
    const data = await r.json();
    if (!r.ok) return data.error;
    await loadTree();
  });
}

async function loadTree() {
  tree = await (await fetch("/api/tree")).json();
  renderSide();
}

function autosize() {
  const t = $("#input");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 200) + "px";
}

// 右栏开关：宽屏默认开、记住选择；窄屏点了才滑出来
function togglePanel() {
  if (matchMedia("(max-width: 1100px)").matches) return document.body.classList.toggle("show-panel");
  const off = document.body.classList.toggle("no-panel");
  try { localStorage.setItem("kiki.panel", off ? "off" : "on"); } catch {}
}
try { if (localStorage.getItem("kiki.panel") === "off") document.body.classList.add("no-panel"); } catch {}

document.body.addEventListener("click", (e) => {
  const dc = e.target.closest("[data-decide]");
  if (dc) return decide(dc.dataset.id, dc.dataset.decide);
  const nb = e.target.closest("[data-new]");
  if (nb) return newSession(nb.dataset.new, nb);
  const it = e.target.closest("[data-path]");
  if (it) return open(it.dataset.path);
  const go = e.target.closest("[data-goto]");
  if (go) {
    const [agent, ...rest] = go.dataset.goto.split("/");
    const s = tree.agents.find((a) => a.name === agent)?.sessions.find((x) => x.name === rest.join("/"));
    if (s) open(s.path);
    return;
  }
  const ch = e.target.closest("[data-choose]");
  if (ch) { $("#input").value = ch.dataset.choose; send(); }
});
$("#add-bao").onclick = newBao;
$("#panel-toggle").onclick = togglePanel;
$("#send").onclick = send;
$("#input").addEventListener("input", autosize);
$("#input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});

const es = new EventSource("/api/events");
es.addEventListener("message", (e) => {
  const m = JSON.parse(e.data);
  if (m.path === "main" && m.role === "assistant" && mainBusy) { mainBusy = false; thinkEyes(); }
  if (m.path === current && m.role === "assistant") $(".pending")?.remove();
  if (m.path !== current) { if (m.role === "assistant") { unread.add(m.path); renderSide(); } return; }
  if (m.role === "assistant" && streaming) { streaming.innerHTML = render(m.text); streaming = null; return; }
  $(".hint")?.remove();
  addMsg(m.role, m.text);
  const p = $(".pending"); if (p) $("#msgs").appendChild(p); // 等待提示始终在最下面
});
es.addEventListener("delta", (e) => {
  const d = JSON.parse(e.data);
  if (d.path !== current) return;
  if (!streaming) { $(".pending")?.remove(); streaming = addMsg("assistant", ""); streaming.dataset.raw = ""; }
  streaming.dataset.raw += d.text;
  streaming.innerHTML = md(streaming.dataset.raw);
  $("#log").scrollTop = $("#log").scrollHeight;
});
es.addEventListener("busy", (e) => {
  const d = JSON.parse(e.data);
  const s = find(d.path);
  if (s) { s.busy = d.busy; renderSide(); } else loadTree(); // 不认识的对话（比如刚交接出来的）就刷新左栏
  if (d.path === current) setPending(d.busy);
});
// 对话在干活、还没吐字时，显示"思考中"
function setPending(on) {
  $(".pending")?.remove();
  if (on && !streaming) {
    const el = addMsg("assistant", "");
    el.className = "msg pending";
    el.innerHTML = '<span class="spin"></span>思考中…';
  }
}
es.addEventListener("tree", (e) => { tree = JSON.parse(e.data); renderSide(); });
es.addEventListener("approvals", (e) => { asks = JSON.parse(e.data); renderSide(); });

// 更新提示：只在有新版本、正在装、出错或回滚时出现；平时不显示
function renderUpdate(u) {
  const el = $("#upd");
  if (!u) return;
  if (u.status === "available")
    el.innerHTML = u.canApply ? `新版本 v${esc(u.latest)} <button id="upd-go">更新</button>` : `新版本 v${esc(u.latest)}（git pull 更新）`;
  else if (u.status === "downloading" || u.status === "installing") el.innerHTML = `<span class="spin"></span>${esc(u.message || "")}`;
  else if (u.status === "error") el.innerHTML = `<span title="${esc(u.message || "")}">更新出错</span>`;
  else if (u.last && u.last.result === "rolled_back" && u.last.from === u.current) el.textContent = `v${u.last.to} 没起来，已回滚`;
  else el.textContent = "";
  const go = $("#upd-go");
  if (go) go.onclick = () => fetch("/api/update/apply", { method: "POST" });
}
es.addEventListener("update", (e) => renderUpdate(JSON.parse(e.data)));
// 每次（重新）连上都刷新一下；Kiki 更新重启后版本号变了，就整页重载，用上新网页
let seenVersion = null;
es.addEventListener("open", () => { loadAsks(); return fetch("/api/update").then((r) => r.ok && r.json()).then((u) => {
    if (!u) return;
    if (seenVersion && seenVersion !== u.current) return location.reload();
    seenVersion = u.current;
    renderUpdate(u);
  }).catch(() => {}); });

loadTree().then(() => open("main"));

// 奇奇的头像换成会动的版本；加载失败就留着静态图
let eyes = null, mainBusy = false;
import("/qiqi-eyes.js").then((m) => { eyes = m.mountQiqi($(".kiki .ava")); thinkEyes(); }).catch(() => {});
// 有对话在干活（包括奇奇自己在分派）时，奇奇抬头看星星
function thinkEyes() {
  eyes?.think(mainBusy || tree.agents.some((a) => a.sessions.some((s) => s.busy)));
}
</script>
