<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiki</title>
<!-- 装成 App：Mac 上 Safari「文件 → 添加到程序坞」，iPhone 上「分享 → 添加到主屏幕」 -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kiki">
<style>
  :root {
    --bg: #ffffff; --side: #f6f6f4; --line: #e6e5e1; --text: #1d1d1b; --muted: #8a8984;
    --hover: #ecebe7; --active: #e2e1dc; --me: #eef0f5; --accent: #5b6cf0; --code: #f3f2ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1b1d; --side: #141416; --line: #2c2c30; --text: #ececec; --muted: #8b8b92;
      --hover: #222226; --active: #2b2b31; --me: #2a2c36; --accent: #8b97ff; --code: #26262b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); display: flex;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* 左边栏 */
  aside { width: 260px; flex: none; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow: auto; padding: 14px 10px; }
  .brand { font-weight: 650; font-size: 17px; padding: 2px 10px 12px; }
  .item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 7px 10px; border-radius: 8px; white-space: nowrap; overflow: hidden; }
  .item:hover { background: var(--hover); }
  .item.on { background: var(--active); }
  .item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .main-bot { font-weight: 600; margin-bottom: 14px; }
  .avatar { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
  .agent { margin-bottom: 10px; }
  .agent-head { display: flex; align-items: center; padding: 4px 10px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .agent-head span { flex: 1; }
  .agent-head button { color: var(--muted); font-size: 17px; line-height: 1; padding: 0 4px; border-radius: 4px; }
  .agent-head button:hover { background: var(--hover); color: var(--text); }
  .sess { padding-left: 18px; font-size: 14px; }
  .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  .spin { width: 11px; height: 11px; border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: r .8s linear infinite; flex: none; }
  @keyframes r { to { transform: rotate(360deg); } }
  .new-input { margin: 2px 0 4px 18px; width: calc(100% - 18px); padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; font-size: 14px; }
  .empty { color: var(--muted); font-size: 13px; padding: 2px 10px 2px 28px; }

  /* 右边聊天 */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { padding: 14px 24px; border-bottom: 1px solid var(--line); font-weight: 600; display: flex; gap: 10px; align-items: baseline; }
  header small { color: var(--muted); font-weight: 400; }
  /* 右上角更新提示 */
  #upd { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  #upd button { color: #fff; background: var(--accent); border-radius: 6px; padding: 1px 8px; font-size: 12px; }
  #log { flex: 1; overflow: auto; padding: 24px; }
  .msgs { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .msg { white-space: normal; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--me); padding: 9px 14px; border-radius: 16px; max-width: 80%; white-space: pre-wrap; }
  .msg.assistant p { margin: 0 0 .6em; } .msg.assistant p:last-child { margin: 0; }
  .msg pre { background: var(--code); padding: 10px 12px; border-radius: 8px; overflow: auto; font-size: 13px; }
  .msg code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-size: 13px; }
  .msg pre code { background: none; padding: 0; }
  .msg a { color: var(--accent); }
  .pending { color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .hint { color: var(--muted); text-align: center; margin-top: 18vh; }
  .composer { padding: 12px 24px 20px; }
  .box { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 8px 14px; background: var(--bg); }
  textarea { flex: 1; border: 0; outline: 0; resize: none; background: none; color: var(--text); font: inherit; max-height: 200px; padding: 4px 0; }
  .send { background: var(--text); color: var(--bg); border-radius: 9px; padding: 0 14px; font-weight: 600; }
  .send:disabled { opacity: .35; cursor: default; }

  @media (max-width: 700px) { aside { width: 200px; } #log, .composer { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<aside>
  <div class="brand">Kiki</div>
  <button class="item main-bot" data-path="main"><span class="avatar">K</span><span class="name">主 bot</span></button>
  <div id="agents"></div>
</aside>
<main>
  <header><span id="title">主 bot</span><small id="sub">随手扔一句、用命令管理对话、收后台回报</small><span id="upd"></span></header>
  <div id="log"><div class="msgs" id="msgs"></div></div>
  <div class="composer">
    <div class="box">
      <textarea id="input" rows="1" placeholder="说点什么… Enter 发送，Shift+Enter 换行"></textarea>
      <button class="send" id="send">发送</button>
    </div>
  </div>
</main>
<script>
const $ = (s) => document.querySelector(s);
let tree = { agents: [] };
let current = "main";
let streaming = null; // 当前对话正在流式输出的那条消息元素
const unread = new Set();

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// 极简 Markdown：代码块、行内代码、粗体、链接、段落
function md(src) {
  const parts = src.split(/```(?:\w*)\n?([\s\S]*?)```/g);
  return parts.map((p, i) => {
    if (i % 2) return `<pre><code>${esc(p)}</code></pre>`;
    return esc(p).split(/\n{2,}/).filter((x) => x.trim()).map((para) =>
      "<p>" + para
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
        .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank">$1</a>')
        .replace(/\n/g, "<br>") + "</p>").join("");
  }).join("");
}

function find(path) {
  for (const a of tree.agents) for (const s of a.sessions) if (s.path === path) return s;
}

function renderSide() {
  document.querySelectorAll(".main-bot").forEach((b) => {
    b.classList.toggle("on", current === "main");
    b.querySelector(".dot")?.remove();
    if (unread.has("main")) b.insertAdjacentHTML("beforeend", '<span class="dot"></span>');
  });
  $("#agents").innerHTML = tree.agents.map((a) => `
    <div class="agent">
      <div class="agent-head"><span>${esc(a.name)}</span><button title="新对话" data-new="${esc(a.name)}">+</button></div>
      ${a.sessions.length ? "" : '<div class="empty">还没有对话</div>'}
      ${a.sessions.map((s) => `
        <button class="item sess ${s.path === current ? "on" : ""}" data-path="${esc(s.path)}">
          <span class="name">${esc(s.name)}</span>
          ${s.background ? '<span class="tag">后台</span>' : ""}
          ${s.busy ? '<span class="spin"></span>' : unread.has(s.path) ? '<span class="dot"></span>' : ""}
        </button>`).join("")}
    </div>`).join("");
}

function addMsg(role, text) {
  const el = document.createElement("div");
  el.className = `msg ${role}`;
  if (role === "user") el.textContent = text; else el.innerHTML = md(text);
  $("#msgs").appendChild(el);
  $("#log").scrollTop = $("#log").scrollHeight;
  return el;
}

async function open(path) {
  current = path;
  unread.delete(path);
  streaming = null;
  const s = find(path);
  $("#title").textContent = path === "main" ? "主 bot" : `${s.agent} / ${s.name}`;
  $("#sub").textContent = path === "main" ? "随手扔一句、用命令管理对话、收后台回报" : (s.background ? "后台任务" : "");
  renderSide();
  const hist = await (await fetch(`/api/history?path=${encodeURIComponent(path)}`)).json();
  $("#msgs").innerHTML = "";
  if (!hist.length) $("#msgs").innerHTML = path === "main"
    ? '<div class="hint">我是 Kiki。直接说话会进当前对话，输入 /help 看命令。</div>'
    : '<div class="hint">新对话，说点什么吧。</div>';
  hist.forEach((m) => addMsg(m.role, m.text));
  if (s?.busy) setPending(true);
  $("#input").focus();
}

async function send() {
  const text = $("#input").value.trim();
  if (!text) return;
  $("#input").value = "";
  autosize();
  $(".hint")?.remove();
  const r = await fetch("/api/send", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ path: current, text }) });
  if (!r.ok) addMsg("assistant", `出错了：${(await r.json()).error}`);
}

async function newSession(agent, btn) {
  const head = btn.closest(".agent");
  if (head.querySelector(".new-input")) return;
  const input = document.createElement("input");
  input.className = "new-input";
  input.placeholder = "对话名字，回车确定";
  head.querySelector(".agent-head").after(input);
  input.focus();
  input.onkeydown = async (e) => {
    if (e.key === "Escape") return input.remove();
    if (e.key !== "Enter" || !input.value.trim()) return;
    const r = await fetch("/api/new", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ agent, name: input.value.trim() }) });
    const data = await r.json();
    if (!r.ok) { input.value = ""; input.placeholder = data.error; return; }
    await loadTree();
    open(data.path);
  };
  input.onblur = () => setTimeout(() => input.remove(), 150);
}

async function loadTree() {
  tree = await (await fetch("/api/tree")).json();
  renderSide();
}

function autosize() {
  const t = $("#input");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 200) + "px";
}

document.body.addEventListener("click", (e) => {
  const nb = e.target.closest("[data-new]");
  if (nb) return newSession(nb.dataset.new, nb);
  const it = e.target.closest("[data-path]");
  if (it) open(it.dataset.path);
});
$("#send").onclick = send;
$("#input").addEventListener("input", autosize);
$("#input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});

const es = new EventSource("/api/events");
es.addEventListener("message", (e) => {
  const m = JSON.parse(e.data);
  if (m.path === current && m.role === "assistant") $(".pending")?.remove();
  if (m.path !== current) { if (m.role === "assistant") { unread.add(m.path); renderSide(); } return; }
  if (m.role === "assistant" && streaming) { streaming.innerHTML = md(m.text); streaming = null; return; }
  $(".hint")?.remove();
  addMsg(m.role, m.text);
});
es.addEventListener("delta", (e) => {
  const d = JSON.parse(e.data);
  if (d.path !== current) return;
  if (!streaming) { $(".pending")?.remove(); streaming = addMsg("assistant", ""); streaming.dataset.raw = ""; }
  streaming.dataset.raw += d.text;
  streaming.innerHTML = md(streaming.dataset.raw);
  $("#log").scrollTop = $("#log").scrollHeight;
});
es.addEventListener("busy", (e) => {
  const d = JSON.parse(e.data);
  const s = find(d.path);
  if (s) { s.busy = d.busy; renderSide(); }
  if (d.path === current) setPending(d.busy);
});
// 对话在干活、还没吐字时，显示"思考中"
function setPending(on) {
  $(".pending")?.remove();
  if (on && !streaming) {
    const el = addMsg("assistant", "");
    el.className = "msg pending";
    el.innerHTML = '<span class="spin"></span>思考中…';
  }
}
es.addEventListener("tree", (e) => { tree = JSON.parse(e.data); renderSide(); });

// 更新提示：有新版本时右上角出一个按钮；正在装 / 出错时显示一行字
function renderUpdate(u) {
  const el = $("#upd");
  if (!u) return;
  const last = u.last && u.last.to === u.current && u.last.result === "ok" ? `已更新到 v${u.current}` :
    u.last && u.last.result === "rolled_back" && u.last.from === u.current ? `v${u.last.to} 没起来，已回滚` : "";
  if (u.status === "available")
    el.innerHTML = u.canApply ? `新版本 v${esc(u.latest)} <button id="upd-go">更新</button>` : `新版本 v${esc(u.latest)}（git pull 更新）`;
  else if (u.status === "downloading" || u.status === "installing") el.innerHTML = `<span class="spin"></span>${esc(u.message || "")}`;
  else if (u.status === "error") el.innerHTML = `<span title="${esc(u.message || "")}">更新出错</span>`;
  else el.textContent = last || `v${u.current}`;
  const go = $("#upd-go");
  if (go) go.onclick = () => fetch("/api/update/apply", { method: "POST" });
}
es.addEventListener("update", (e) => renderUpdate(JSON.parse(e.data)));
// 每次（重新）连上都刷新一下；Kiki 更新重启后版本号变了，就整页重载，用上新网页
let seenVersion = null;
es.addEventListener("open", () =>
  fetch("/api/update").then((r) => r.ok && r.json()).then((u) => {
    if (!u) return;
    if (seenVersion && seenVersion !== u.current) return location.reload();
    seenVersion = u.current;
    renderUpdate(u);
  }).catch(() => {}));

loadTree().then(() => open("main"));
</script>
</body>
</html>
