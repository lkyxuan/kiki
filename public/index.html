<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiki</title>
<!-- 装成 App：Mac 上 Safari「文件 → 添加到程序坞」，iPhone 上「分享 → 添加到主屏幕」 -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kiki">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); display: flex;
    font: 15px/1.6 var(--font); -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: default; }
  svg.i { width: 16px; height: 16px; flex: none; }

  /* 左栏：奇奇 + 我的宝（像 macOS 的侧栏：浅一档的底色、圆角选中条） */
  aside { width: 256px; flex: none; background: var(--side); border-right: 1px solid var(--divider); display: flex; flex-direction: column; overflow: auto; padding: 12px 10px; font-size: 14px; }
  .item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; min-height: 32px; padding: 5px 10px; border-radius: 7px; white-space: nowrap; overflow: hidden; transition: background .12s; }
  .item:hover { background: var(--hover); }
  .item.on { background: var(--active); font-weight: 500; }
  .item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  /* 奇奇主按钮：和对话条目不一样，居中、大头像（会动，见 public/qiqi-eyes.js） */
  .kiki { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; padding: 18px 10px 14px; border-radius: 12px; font-weight: 600; font-size: 15px; transition: background .12s; }
  .kiki .ava { display: block; width: 68px; height: 68px; border-radius: 50%; overflow: hidden; transition: transform .2s cubic-bezier(.2,.8,.2,1); box-shadow: var(--shadow-sm); }
  .kiki .ava img, .kiki .ava svg { display: block; width: 100%; height: 100%; }
  .kiki:hover { background: var(--hover); }
  .kiki:hover .ava { transform: scale(1.04); }
  .kiki.on { background: var(--active); }
  .kiki.on .ava { box-shadow: 0 0 0 3px var(--side), 0 0 0 5px var(--accent); }
  .qiqi-ava .iris { transition: transform .35s ease-out; } /* 奇奇转眼珠 */
  .kiki .dot { position: absolute; top: 18px; right: calc(50% - 38px); width: 10px; height: 10px; border: 2px solid var(--side); }
  .label { font-size: 12px; font-weight: 600; color: var(--muted); padding: 16px 10px 4px; }
  .bao { margin-bottom: 4px; }
  .bao-head { display: flex; align-items: center; gap: 10px; padding: 5px 4px 5px 10px; font-weight: 500; }
  .sub-head { color: var(--muted); font-size: 12px; font-weight: 600; padding-top: 10px; }
  #qiqi .sess { padding-left: 22px; }
  #qiqi .empty { padding-left: 22px; }
  .bao-head[data-bao] { cursor: pointer; border-radius: 7px; transition: background .12s; }
  .bao-head[data-bao]:hover { background: var(--hover); }
  .bao-head.on { background: var(--active); }
  .bao-head .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bao-head button { color: var(--muted); width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; opacity: 0; transition: opacity .12s, background .12s; }
  .bao:hover .bao-head button, .bao-head button:focus-visible { opacity: 1; }
  .bao-head button:hover { background: var(--active); color: var(--text); }
  .avatar { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; flex: none; color: #fff; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.1); }
  .sess { padding-left: 42px; min-height: 30px; }
  .tag { font-size: 11px; color: var(--muted); background: var(--fill); border-radius: 4px; padding: 0 5px; line-height: 17px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  .spin { width: 11px; height: 11px; border: 2px solid var(--faint); border-top-color: transparent; border-radius: 50%; animation: r .8s linear infinite; flex: none; }
  @keyframes r { to { transform: rotate(360deg); } }
  .new-input { margin: 2px 0 6px 42px; width: calc(100% - 42px); padding: 5px 8px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--raised); font-size: 14px; outline: 0; }
  .new-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .new-bao-input { margin: 4px 0 6px; width: 100%; }
  .empty { color: var(--faint); font-size: 13px; padding: 2px 10px 4px 42px; }
  .add-bao { color: var(--muted); margin-top: 2px; }
  .add-bao:hover { color: var(--text); }
  .settings { margin-top: auto; color: var(--text); text-decoration: none; }

  /* 中间：对话 */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  header { min-height: 52px; padding: 9px 14px 9px 24px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; background: var(--material); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); position: relative; z-index: 2; }
  #title { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #title .crumb { color: var(--muted); font-weight: 400; }
  #upd { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  #upd:empty { display: none; }
  #upd button { color: var(--on-accent); background: var(--accent); border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 500; }
  .icon-btn { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: var(--muted); flex: none; }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  #panel-toggle { margin-left: auto; }
  #upd:not(:empty) + #panel-toggle { margin-left: 0; }
  #log { flex: 1; overflow: auto; padding: 28px 24px; }
  .msgs { max-width: 740px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .msg { white-space: normal; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--me); color: var(--me-text); padding: 8px 14px; border-radius: 18px 18px 6px 18px; max-width: 78%; white-space: pre-wrap; box-shadow: var(--shadow-sm); }
  .msg.assistant p { margin: 0 0 .6em; } .msg.assistant p:last-child { margin: 0; }
  .msg pre { background: var(--fill); padding: 12px 14px; border-radius: 10px; overflow: auto; font: 13px/1.55 var(--mono); }
  .msg code { background: var(--fill); padding: 1px 5px; border-radius: 5px; font: .87em var(--mono); }
  .msg pre code { background: none; padding: 0; font-size: inherit; }
  .msg a { color: var(--accent); text-decoration: none; }
  .msg a:hover { text-decoration: underline; }
  .pending { color: var(--muted); display: flex; gap: 8px; align-items: center; font-size: 14px; min-width: 0; }
  .pending .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .pending .elapsed { color: var(--faint); flex: none; font-variant-numeric: tabular-nums; }
  /* 做过的步骤（像 Claude 的工具卡片）：干活时展开，做完折叠成“用了 3 个工具” */
  .steps { font-size: 13px; color: var(--muted); max-width: 640px; }
  .steps summary { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; list-style: none; padding: 2px 8px 2px 4px; margin-left: -4px; border-radius: 6px; }
  .steps summary::-webkit-details-marker { display: none; }
  .steps summary:hover { background: var(--hover); color: var(--text); }
  .steps .chev { width: 12px; height: 12px; transition: transform .15s; }
  .steps[open] .chev { transform: rotate(90deg); }
  .steps ol { list-style: none; margin: 6px 0 2px 5px; padding: 0 0 0 14px; border-left: 1px solid var(--line-strong); display: flex; flex-direction: column; gap: 4px; }
  .steps li { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .steps li .t { color: var(--text); flex: none; }
  .steps li .d { font: 12px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .steps li .ms { margin-left: auto; padding-left: 8px; color: var(--faint); flex: none; font-variant-numeric: tabular-nums; }
  .steps .ok { color: var(--ok); flex: none; width: 12px; text-align: center; }
  .steps .bad { color: var(--err); flex: none; width: 12px; text-align: center; }
  .steps .spin { width: 10px; height: 10px; }
  .hint { color: var(--muted); text-align: center; margin-top: 18vh; font-size: 14px; line-height: 1.8; }
  /* 奇奇的回执卡片：发到哪个宝的哪段对话 */
  .receipt { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 10px 10px 14px; margin-bottom: 12px; max-width: 520px; box-shadow: var(--shadow-sm); }
  .receipt .avatar { width: 28px; height: 28px; border-radius: 8px; font-size: 13px; }
  .receipt .where { flex: 1; min-width: 0; line-height: 1.4; }
  .receipt .how { display: block; font-size: 12px; color: var(--muted); }
  .receipt b { font-weight: 600; font-size: 14px; }
  .receipt button { border-radius: 999px; padding: 4px 14px; font-size: 13px; font-weight: 500; color: var(--accent); background: var(--accent-soft); }
  .receipt button:hover { filter: brightness(.96); }
  /* 对话引用的小卡片：嵌在文字里，点了在右栏打开那段对话 */
  .chip { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; vertical-align: baseline; margin: 0 2px; padding: 0 8px 0 6px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font: inherit; font-size: .95em; font-weight: 500; line-height: 1.6; cursor: pointer; }
  .chip svg { width: 13px; height: 13px; flex: none; }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip:hover { filter: brightness(.95); }
  .chip.on { box-shadow: 0 0 0 1.5px var(--accent); }
  .via { color: var(--muted); }
  .via .how { margin-left: 6px; font-size: 12px; color: var(--faint); }
  /* 右栏里打开的对话（点小卡片打开）：能看、能接着说，也能挪到中间 */
  #peek { width: 420px; flex: none; border-left: 1px solid var(--divider); background: var(--bg); display: flex; flex-direction: column; min-height: 0; }
  #peek[hidden] { display: none; }
  #peek .peek-head { display: flex; align-items: center; gap: 8px; padding: 12px 10px 12px 16px; border-bottom: 1px solid var(--line); }
  #peek .peek-head .t { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #peek .peek-head .t .crumb { color: var(--muted); font-weight: 500; }
  #peek .peek-head button { font-size: 13px; color: var(--muted); padding: 4px 8px; border-radius: 6px; }
  #peek .peek-head button:hover { background: var(--hover); color: var(--text); }
  #peek-log { flex: 1; overflow: auto; padding: 14px 16px; }
  #peek-log .msg { font-size: 14px; }
  #peek .composer { padding: 8px 12px 14px; }
  /* 捎话的回复：折叠成卡片，样式跟回执一致 */
  .relay-back { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px 10px 14px; max-width: 520px; }
  .relay-back summary { display: flex; align-items: center; gap: 12px; cursor: pointer; list-style: none; }
  .relay-back summary::-webkit-details-marker { display: none; }
  .relay-back .where { flex: 1; min-width: 0; line-height: 1.4; }
  .relay-back .how { display: block; font-size: 12px; color: var(--muted); }
  .relay-back b { font-weight: 600; font-size: 14px; }
  .relay-back .peek { display: block; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .relay-back[open] .peek { display: none; }
  .relay-back[open] summary { margin-bottom: 8px; }
  .relay-back button { border-radius: 999px; padding: 4px 14px; font-size: 13px; font-weight: 500; color: var(--accent); background: var(--accent-soft); }
  .relay-back button:hover { filter: brightness(.96); }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .choices button { border: 1px solid var(--line-strong); background: var(--card); border-radius: 999px; padding: 5px 14px; text-align: left; font-size: 14px; box-shadow: var(--shadow-sm); }
  .choices button:hover { border-color: var(--accent); color: var(--accent); }
  /* 等你点头：收不回来的动作做之前先问一句，卡片在输入框上方 */
  #asks { padding: 0 24px; }
  #asks:empty { display: none; }
  .ask { max-width: 740px; margin: 0 auto 10px; border: 1px solid var(--accent); background: var(--card); border-radius: 14px; padding: 12px 12px 12px 16px; box-shadow: var(--shadow), 0 0 0 3px var(--accent-soft); }
  .ask .what { font-size: 13px; color: var(--muted); }
  .ask .what b { color: var(--text); font-weight: 600; }
  .ask pre { margin: 6px 0 10px; background: var(--fill); padding: 8px 10px; border-radius: 8px; overflow: auto; font: 12.5px/1.5 var(--mono); max-height: 160px; white-space: pre-wrap; word-break: break-all; }
  .ask .btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .ask .btns button { border: 1px solid var(--line-strong); border-radius: 7px; padding: 3px 12px; font-size: 13px; font-weight: 500; background: var(--raised); box-shadow: var(--shadow-sm); }
  .ask .btns button:hover { background: var(--hover); }
  .ask .btns button.yes { background: var(--accent); border-color: transparent; color: var(--on-accent); }
  .ask .btns button.yes:hover { background: var(--accent-hover); }
  .ask .btns a { margin-left: auto; font-size: 13px; color: var(--accent); }
  .composer { padding: 8px 24px 20px; }
  .box { max-width: 740px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; border: 1px solid var(--line-strong); border-radius: 20px; padding: 7px 7px 7px 16px; background: var(--raised); box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s; }
  .box:focus-within { border-color: var(--accent); box-shadow: var(--shadow), 0 0 0 3px var(--accent-soft); }
  textarea { flex: 1; border: 0; outline: 0; resize: none; background: none; color: var(--text); font: inherit; max-height: 200px; padding: 4px 0; align-self: center; }
  textarea::placeholder { color: var(--faint); }
  .send { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; transition: background .15s, opacity .15s, transform .1s; }
  .send:hover { background: var(--accent-hover); }
  .send:active { transform: scale(.94); }
  .send:disabled { opacity: .3; }
  .send svg { width: 18px; height: 18px; }

  /* 最右一列：这个宝的长期情况（等你点头、出问题、正在跑、定时任务、后台任务），和短期对话分开，一直在 */
  #panel { width: 280px; flex: none; border-left: 1px solid var(--divider); background: var(--side); overflow: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 18px; }
  body.no-panel #panel { display: none; }
  #panel .ptitle { font-weight: 600; font-size: 15px; margin: -4px 4px -6px; }
  #panel .row .bad { color: var(--err); flex: none; width: 14px; text-align: center; }
  #panel h3 { margin: 0 0 6px 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
  #panel .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 4px 12px; font-size: 14px; box-shadow: var(--shadow-sm); }
  #panel .row { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  #panel .row:first-child { border-top: 0; }
  #panel button.row:hover .name { color: var(--accent); }
  #panel .row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #panel .row small { color: var(--muted); font-size: 12px; }
  #panel .row small.st { max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #panel .none { color: var(--faint); font-size: 13px; padding: 8px 0; }
  #panel .about { font-size: 13px; line-height: 1.6; color: var(--text); white-space: pre-wrap; max-height: 220px; overflow: hidden; padding: 8px 0 4px; }
  #panel a { display: inline-block; color: var(--accent); font-size: 13px; text-decoration: none; padding: 4px 0 8px; }

  /* 设置弹窗：盖在聊天页上，右上角 ×，Esc 或点外面关掉 */
  #sheet { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .18s; }
  #sheet.on { opacity: 1; pointer-events: auto; }
  .avatar.emoji { background: var(--fill); box-shadow: none; font-size: 14px; font-weight: 400; }
  .receipt .avatar.emoji { font-size: 17px; }
  /* 新建宝：小弹窗，只问名字、负责什么、头像 */
  #newbao { position: fixed; inset: 0; z-index: 21; display: grid; place-items: center; background: var(--scrim); }
  #newbao[hidden] { display: none; }
  #newbao form { width: min(400px, calc(100% - 32px)); background: var(--grouped); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 20px 20px 16px; display: grid; gap: 12px; animation: nb-in .2s cubic-bezier(.2,.8,.2,1); }
  @keyframes nb-in { from { transform: scale(.96) translateY(6px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #newbao form { animation: none; } }
  #newbao h2 { margin: 0; font-size: 15px; font-weight: 600; }
  #newbao .sub { margin: -8px 0 0; font-size: 12.5px; color: var(--muted); }
  #newbao label { display: grid; gap: 5px; font-size: 12.5px; color: var(--muted); }
  #newbao input, #newbao textarea { font: inherit; font-size: 13.5px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; outline: none; resize: none; }
  #newbao input:focus, #newbao textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  #newbao .faces { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #newbao .faces button { width: 32px; height: 32px; border-radius: 8px; font-size: 17px; display: grid; place-items: center; background: var(--fill); }
  #newbao .faces button.on { box-shadow: 0 0 0 2px var(--accent); }
  #newbao .faces .letter { font-size: 13px; font-weight: 700; color: #fff; }
  #newbao .faces input { width: 64px; text-align: center; padding: 6px; }
  #newbao .err { color: #e0475f; font-size: 12.5px; min-height: 0; margin: -4px 0 0; }
  #newbao .err:empty { display: none; }
  #newbao .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  #newbao .btns button { font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 7px; background: var(--fill); color: var(--text); }
  #newbao .btns .primary { background: var(--accent); color: #fff; }
  #newbao .btns .primary:disabled { opacity: .5; }
  #sheet[hidden] { display: none; } /* 关着时彻底移出 Tab 键顺序 */
  #updating[hidden] { display: none !important; } /* 行内 display:grid 会盖过 hidden，必须单独写 */
  #sheet .win { width: min(960px, calc(100% - 48px)); height: min(88vh, 920px); background: var(--grouped); border-radius: 14px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; overflow: hidden; position: relative; transform: scale(.97) translateY(6px); transition: transform .22s cubic-bezier(.2,.8,.2,1); }
  #sheet.on .win { transform: none; }
  #sheet .close { position: absolute; z-index: 1; right: 14px; top: 14px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); background: var(--fill); }
  #sheet .close:hover { color: var(--text); background: var(--active); }
  #sheet iframe { flex: 1; border: 0; width: 100%; background: var(--grouped); }

  @media (max-width: 1400px) { #peek:not([hidden]) { position: fixed; right: 0; top: 0; bottom: 0; z-index: 6; width: min(440px, 100%); box-shadow: -8px 0 24px rgba(0,0,0,.12); } }
  @media (max-width: 1100px) { #panel { display: none; } body.show-panel #panel { display: flex; position: fixed; right: 0; top: 0; bottom: 0; z-index: 5; box-shadow: -8px 0 24px rgba(0,0,0,.12); } }
  @media (max-width: 700px) { aside { width: 200px; } #log, .composer, #asks { padding-left: 16px; padding-right: 16px; } #sheet .win { width: 100%; height: 100%; border-radius: 0; } }
  /* Kiki.app：没有单独的标题栏，三栏颜色铺到顶；左上角给红绿灯让位，顶部空白处可以拖动窗口 */
  .kiki-fullsize aside { padding-top: 40px; }
  .kiki-fullsize header, .kiki-fullsize #panel h3 { -webkit-user-select: none; user-select: none; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation-duration: .01ms !important; } }
</style>
</head>
<body>
<aside>
  <button class="kiki" data-path="main" aria-label="奇奇"><span class="ava"><img src="/qiqi.png" alt=""></span><span class="name">奇奇</span></button>
  <div id="qiqi"></div>

  <a class="item settings" href="/settings.html" data-settings><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="name">设置</span></a>

<!-- 更新进行中的弹窗：点「现在更新」或后台自动更新时盖在最上面，告诉你 Kiki 正在更新、到哪一步了 -->
<div id="updating" role="alertdialog" aria-modal="true" aria-labelledby="updating-title" hidden
  style="position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--scrim, rgba(0,0,0,.35))">
  <div style="width: min(420px, calc(100vw - 32px)); background: var(--bg, #fff); color: var(--text, #1d1d1b); border-radius: 14px; padding: 22px 22px 18px; box-shadow: 0 20px 60px rgba(0,0,0,.25)">
    <div id="updating-title" style="font-size: 17px; font-weight: 600; margin-bottom: 4px">Kiki 正在更新</div>
    <div id="updating-ver" style="font-size: 13px; color: var(--muted, #6f6e69); margin-bottom: 14px"></div>
    <progress id="updating-bar" max="100" value="0" style="width: 100%; height: 8px; accent-color: var(--accent, #2f7d4f)"></progress>
    <div id="updating-step" style="font-size: 13px; margin-top: 8px; min-height: 1.4em"></div>
    <div style="font-size: 12px; color: var(--muted, #6f6e69); margin-top: 12px">更新完会自动重启并刷新页面，前后一般不到一分钟。对话记录不受影响。</div>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
let tree = { agents: [] };
let current = "main";
let streaming = null; // 当前对话正在流式输出的那条消息元素
let lastStreamed = null; // 上一段流完的文字（工具调用前说的话），最终回答跟它一样就不再重复显示
let live = {}; // 对话 path -> 这一轮的进度 {since, status, steps}，奇奇是 main：{since, status, follow}
const shown = new Set(); // 已经画进折叠卡片的步骤 id，正在进行的卡片里不再重复
const unread = new Set();
const DEFAULT_BAO = "奇奇"; // 默认的宝，和 src/migrate.ts 一致
const aboutCache = {}; // 宝名 -> AGENTS.md 开头几行
let asks = []; // 等你点头的卡片

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// 对话引用 [名字](kiki:宝/对话) → 行内小卡片，点了在右栏打开那段对话（参数都已经转义过）
const CHAT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>';
const chip = (to, title) => `<button class="chip" data-peek="${to}" title="在右边打开 ${to}">${CHAT_ICON}<span>${title}</span></button>`;
// 极简 Markdown：代码块、行内代码、粗体、链接、段落
function md(src) {
  const parts = src.split(/```(?:\w*)\n?([\s\S]*?)```/g);
  return parts.map((p, i) => {
    if (i % 2) return `<pre><code>${esc(p)}</code></pre>`;
    return esc(p).split(/\n{2,}/).filter((x) => x.trim()).map((para) =>
      "<p>" + para
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
        .replace(/\[([^\]]+)\]\(kiki:([^)\n]+)\)/g, (_, t, to) => chip(to, t))
        .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank">$1</a>')
        .replace(/\n/g, "<br>") + "</p>").join("");
  }).join("");
}

// 每个宝一个固定颜色（按名字算），头像显示名字第一个字
const COLORS = ["#3a7bf0", "#2f9e57", "#e07b12", "#9a55d6", "#e0475f", "#1f9aa8"]; // 接近 macOS 系统色，白字仍看得清
function color(name) { let h = 0; for (const c of name) h = (h * 31 + c.codePointAt(0)) >>> 0; return COLORS[h % COLORS.length]; }
const emojiOf = (name) => tree?.agents?.find((a) => a.name === name)?.emoji;
const avatar = (name) => { const e = emojiOf(name); return e ? `<span class="avatar emoji">${esc(e)}</span>` : `<span class="avatar" style="background:${color(name)}">${esc([...name][0].toUpperCase())}</span>`; };
const PLUS = '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

function find(path) {
  for (const a of tree.agents) for (const s of a.sessions) if (s.path === path) return s;
}

function renderSide() {
  if (typeof thinkEyes === "function") thinkEyes();
  const k = $(".kiki");
  k.classList.toggle("on", current === "main");
  k.querySelector(".dot")?.remove();
  if (unread.has("main")) k.insertAdjacentHTML("beforeend", '<span class="dot"></span>');
  // 两层：每个宝有一段「主对话」（点宝名打开，在中间），其余是讨论串（列在宝下面，点了在右栏打开）
  const sessRows = (a) => { const th = threads(a); return (th.length ? "" : '<div class="empty">还没有讨论串</div>') + th.map((s) => `
        <button class="item sess ${s.path === current || s.path === peek ? "on" : ""}" data-thread="${esc(s.path)}"${s.live ? ` title="${esc(s.live.status)}"` : ""}>
          <span class="name">${esc(s.name)}</span>
          ${s.background ? '<span class="tag">后台</span>' : ""}
          ${s.busy ? '<span class="spin"></span>' : unread.has(s.path) ? '<span class="dot"></span>' : ""}
        </button>`).join(""); };
  const newBtn = (name) => `<button title="在${esc(name)}里新开讨论串" aria-label="在${esc(name)}里新开讨论串" data-new="${esc(name)}">${PLUS}</button>`;
  // 奇奇是默认的宝：它的对话直接列在主按钮下面；别的宝都是从奇奇分出去的，列在“我的宝”
  const qiqi = tree.agents.find((a) => a.name === DEFAULT_BAO);
  $("#qiqi").innerHTML = qiqi ? `<div class="bao"><div class="bao-head sub-head"><span class="name">讨论串</span>${newBtn(qiqi.name)}</div>${sessRows(qiqi)}</div>` : "";
  const others = tree.agents.filter((a) => a.name !== DEFAULT_BAO);
  $("#baos-label").hidden = !others.length;
  $("#agents").innerHTML = others.map((a) => `
    <div class="bao">
      ${baoHead(a)}
      ${sessRows(a)}
    </div>`).join("");
  renderPanel();
}

// 宝的主对话（名字固定，见 src/bao.ts 的 MAIN_SESSION）；其余的对话都是讨论串
const MAIN_SESSION = "主对话";
const mainOf = (a) => a.sessions.find((s) => s.name === MAIN_SESSION);
const threads = (a) => a.sessions.filter((s) => s.name !== MAIN_SESSION);
// 宝名那一行：点了在中间打开它的主对话；还没有主对话的老数据，点了就新建一段
function baoHead(a) {
  const m = mainOf(a), on = m && m.path === current;
  const mark = m ? (m.busy ? '<span class="spin"></span>' : unread.has(m.path) ? '<span class="dot"></span>' : "") : "";
  return `<div class="bao-head ${on ? "on" : ""}" data-bao="${esc(a.name)}" role="button" tabindex="0" title="打开${esc(a.name)}的主对话">${avatar(a.name)}<span class="name">${esc(a.name)}</span>${mark}<button title="在${esc(a.name)}里新开讨论串" aria-label="在${esc(a.name)}里新开讨论串" data-new="${esc(a.name)}">${PLUS}</button></div>`;
}
async function openBao(name) {
  let a = tree.agents.find((x) => x.name === name);
  let m = a && mainOf(a);
  if (!m) { // 还没补上主对话：建一段
    const r = await fetch("/api/new", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ agent: name, name: MAIN_SESSION }) });
    if (!r.ok) return;
    await loadTree();
    a = tree.agents.find((x) => x.name === name); m = a && mainOf(a);
  }
  if (m) open(m.path);
}

// 右栏：哪些对话在干活、后台任务、当前这个宝
// 最右一列：当前这一层的长期情况。在奇奇看全部，在某个宝里只看这个宝
const layerOf = () => (current === "main" ? null : find(current)?.agent ?? null);
function renderPanel() {
  const layer = layerOf(), mine = (agent) => !layer || agent === layer;
  const all = tree.agents.filter((a) => mine(a.name)).flatMap((a) => a.sessions);
  // 后面的小字：在干活就写它正在干嘛（正在运行命令…），不然写是哪个宝的
  const row = (s) => `<button class="row" data-thread="${esc(s.path)}">${s.busy ? '<span class="spin"></span>' : avatar(s.agent)}<span class="name">${esc(s.name)}</span><small class="st">${esc(s.busy && s.live ? s.live.status : s.agent)}</small></button>`;
  const card = (title, body) => `<div><h3>${title}</h3><div class="card">${body}</div></div>`;
  const busy = all.filter((s) => s.busy);
  const bg = all.filter((s) => s.background).sort((x, y) => String(y.created).localeCompare(String(x.created))).slice(0, 8);
  const tasks = (tree.tasks || []).filter((t) => mine(t.agent));
  const bad = tasks.filter((t) => t.status === "failed" || t.status === "interrupted").slice(-5).reverse();
  const queued = tasks.filter((t) => t.status === "queued");
  let html = `<div class="ptitle">${layer ? esc(layer) : "全部"}的情况</div>`;
  const back = !peek && lastPeek && find(lastPeek);
  if (back) html += card("刚才看的", `<button class="row" data-thread="${esc(back.path)}">${back.busy ? '<span class="spin"></span>' : avatar(back.agent)}<span class="name">${esc(back.name)}</span><small>${esc(back.agent)}</small></button>`);
  const myAsks = asks.filter((a) => mine(a.agent));
  if (myAsks.length) html += card("等你点头", myAsks.map((a) => { const s = find(a.path); return `<button class="row" data-path="${esc(a.path)}">${avatar(a.agent)}<span class="name">${esc(a.categoryName)}</span><small>${esc(s ? s.name : a.agent)}</small></button>`; }).join(""));
  if (bad.length) html += card("出了问题", bad.map((t) => `<button class="row" ${t.session ? `data-thread="${esc(t.session)}"` : ""} title="${esc(t.result || "")}"><span class="bad">!</span><span class="name">${esc(t.title)}</span><small>${t.status === "failed" ? "失败" : "中断"}</small></button>`).join(""));
  html += card("正在跑", busy.length || queued.length ? busy.map(row).join("") + queued.map((t) => `<div class="row"><span class="spin" style="opacity:.4"></span><span class="name">${esc(t.title)}</span><small>排队</small></div>`).join("") : '<div class="none">现在没有在跑的</div>');
  html += card("定时任务", '<div class="none">还没有定时任务</div>');
  html += card("后台任务", bg.length ? bg.map(row).join("") : '<div class="none">还没有后台任务</div>');
  const name = layer || DEFAULT_BAO, about = aboutCache[name];
  html += card(`关于${esc(name)}`, `<div class="about">${about === undefined ? "读取中…" : esc(about || "还没写说明")}</div><a href="/settings.html#baos" data-settings="baos">编辑说明</a>`);
  if (about === undefined) loadAbout(name);
  $("#panel").innerHTML = html;
  renderAsks();
}
// 卡片：奇奇（收件箱）里显示全部，某段对话里只显示它自己的
function renderAsks() {
  const mine = current === "main" ? asks : asks.filter((a) => a.path === current || a.path === peek); // 右栏开着的讨论串要点头，也显示在这里
  $("#asks").innerHTML = mine.map((a) => {
    const s = find(a.path);
    const where = s ? `${esc(a.agent)} › ${esc(s.name)}` : esc(a.agent);
    return `<div class="ask"><div class="what"><b>${esc(a.categoryName)}</b> · ${where} 想做这一步，同意吗？</div>
      <pre>${esc(a.detail)}</pre>
      <div class="btns"><button class="yes" data-decide="yes" data-id="${a.id}">同意</button><button data-decide="no" data-id="${a.id}">不同意</button><button data-decide="always" data-id="${a.id}" title="${esc(a.label)}">以后这类都同意</button>${current === "main" && s ? `<a data-path="${esc(a.path)}">打开对话</a>` : ""}</div></div>`;
  }).join("");
  // 奇奇按钮上的小点：有卡片在等
  const k = $(".kiki");
  if (asks.length && !k.querySelector(".dot")) k.insertAdjacentHTML("beforeend", '<span class="dot"></span>');
}
async function decide(id, decision) {
  const r = await fetch("/api/approvals/decide", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id, decision }) });
  if (!r.ok) { asks = asks.filter((a) => a.id !== id); renderSide(); }
}
async function loadAsks() {
  try { const r = await fetch("/api/approvals"); if (r.ok) asks = await r.json(); } catch {}
  renderSide();
}
async function loadAbout(name) {
  aboutCache[name] = "";
  try {
    const r = await fetch("/api/settings/agent?name=" + encodeURIComponent(name));
    if (r.ok) aboutCache[name] = (await r.json()).text.split("\n").map((l) => l.replace(/^#+\s*/, "")).filter((l) => l.trim()).slice(0, 8).join("\n");
  } catch {}
  renderPanel();
}

// 奇奇的回执："→ 奇奇/周报 · 接着聊" 第一行渲染成卡片；拿不准时的 "1. …" 渲染成按钮
function render(text) {
  const r = text.match(/^→ (\S+?)\/(.+?) · (\S+)\n\n([\s\S]*)$/);
  if (r) return `<p class="via">已交给 ${chip(esc(r[1] + "/" + r[2]), esc(r[2]))}<span class="how">${esc(r[1])} · ${esc(r[3])}</span></p>` + md(r[4]);
  // 捎话的回复（kiki_relay 记回来的）：完整内容在那段对话里已经有了，这里折叠成一张卡片，免得两段对话看起来一模一样
  const back = text.match(/^【(\S+?)\/(.+?) (回复|出错)】\s*([\s\S]*)$/);
  if (back) {
    const first = back[4].split("\n").find((l) => l.trim()) ?? "";
    return `<details class="relay-back"><summary><span class="where"><span class="how">${back[3] === "回复" ? "捎话的回复" : "捎话出错"}</span><b>${esc(back[1])} › ${esc(back[2])}</b><span class="peek">${esc(first.replace(/[*#`]/g, "").slice(0, 60))}</span></span><button data-goto="${esc(back[1] + "/" + back[2])}">打开对话</button></summary>${md(back[4])}</details>`;
  }
  if (text.startsWith("🤔")) {
    const [head, ...opts] = text.split("\n");
    return md(head.replace(/^🤔\s*/, "")) + '<div class="choices">' + opts.map((o) => {
      const m = o.match(/^(\d+)\. (.+)$/);
      return m ? `<button data-choose="${m[1]}">${esc(m[2])}</button>` : "";
    }).join("") + "</div>";
  }
  return md(text);
}

function addMsg(role, text, steps) {
  if (steps?.length) $("#msgs").appendChild(stepsBox(steps, false));
  const el = document.createElement("div");
  el.className = `msg ${role}`;
  if (role === "user") el.textContent = text; else el.innerHTML = render(text);
  $("#msgs").appendChild(el);
  $("#log").scrollTop = $("#log").scrollHeight;
  return el;
}

async function open(path) {
  // 中间只放奇奇和各个宝的主对话；讨论串一律在右边打开
  const t = path !== "main" && find(path);
  if (t && t.name !== MAIN_SESSION) return openPeek(path, true);
  current = path;
  unread.delete(path);
  streaming = null;
  const s = find(path);
  $("#title").innerHTML = path === "main" ? "奇奇" : s.name === MAIN_SESSION ? `${esc(s.agent)} <span class="crumb">· 主对话</span>` : `<span class="crumb">${esc(s.agent)} › </span>${esc(s.name)}${s.background ? ' <span class="tag">后台</span>' : ""}`;
  document.body.classList.remove("show-panel");
  renderSide();
  const hist = await (await fetch(`/api/history?path=${encodeURIComponent(path)}`)).json();
  if (path !== current) return; // 连点两段对话时，先发的请求可能后回来，别把上一段的内容画到这一段
  $("#msgs").innerHTML = "";
  if (!hist.length) $("#msgs").innerHTML = path === "main"
    ? '<div class="hint">跟奇奇说就行，它会分给对应的宝。<br>@宝名 可以直接指定，/help 看命令。</div>'
    : s?.name === MAIN_SESSION ? `<div class="hint">这是${esc(s.agent)}的主对话，直接在这儿派活就行。<br>细的事它会分到讨论串里，点开在右边看。</div>` : '<div class="hint">新对话，说点什么吧。</div>';
  shown.clear(); lastStreamed = null;
  hist.forEach((m) => addMsg(m.role, m.text, m.steps));
  renderLive();
  $("#input").focus();
}

async function send() {
  const text = $("#input").value.trim();
  if (!text) return;
  $("#input").value = "";
  autosize();
  syncSend();
  $(".hint")?.remove();
  const r = await fetch("/api/send", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ path: current, text }) });
  if (r.ok && current === "main") { // 奇奇要先路由再回答，先给个等待提示，服务端的进度到了会接上
    mainBusy = true; thinkEyes();
    if (!live.main) live.main = { since: Date.now(), status: "收到，正在看…" };
    renderLive();
  }
  if (!r.ok) addMsg("assistant", `出错了：${(await r.json()).error}`);
}

// 右栏打开一段对话（点对话小卡片）：像 Claude Desktop 那样，主对话不动，旁边看那段、也能接着说
let peek = null, peekStream = null, lastPeek = null; // lastPeek：关掉后在总览里留个「刚才看的」，一点就回去
function byLabel(lbl) {
  const i = lbl.indexOf("/");
  return tree.agents.find((a) => a.name === lbl.slice(0, i))?.sessions.find((x) => x.name === lbl.slice(i + 1));
}
async function openPeek(lbl, byPath) {
  const look = () => (byPath ? find(lbl) : byLabel(lbl));
  let s = look();
  if (!s) { await loadTree(); s = look(); } // 刚交接出来的对话，左栏可能还没刷新
  if (!s) return;
  if (s.name === MAIN_SESSION) return open(s.path); // 主对话放中间
  peek = lastPeek = s.path; peekStream = null;
  unread.delete(s.path); // 在右边看了就算读过
  $("#peek-title").innerHTML = `<span class="crumb">${esc(s.agent)} › </span>${esc(s.name)}`;
  $("#peek").hidden = false;
  document.body.classList.add("peeking");
  markChips(); renderSide();
  await refreshPeek();
  $("#peek-input").focus();
}
function closePeek() {
  peek = null; peekStream = null;
  $("#peek").hidden = true;
  document.body.classList.remove("peeking");
  markChips(); renderSide();
}
// 正在右边打开的那段，对应的小卡片加个框
function markChips() {
  const s = peek && find(peek);
  const lbl = s ? `${s.agent}/${s.name}` : null;
  document.querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", c.dataset.peek === lbl));
}
// expect：刚收到的一条回答。历史里还没有它（比如没进记录的报错）就补在最后
async function refreshPeek(expect) {
  const path = peek;
  if (!path) return;
  const r = await fetch(`/api/history?path=${encodeURIComponent(path)}`);
  if (path !== peek || !r.ok) return;
  const hist = await r.json();
  const log = $("#peek-log"), atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  const keep = peekStream; // 请求发出后才流进来的字，快照里没有，不能丢
  const lastA = [...hist].reverse().find((m) => m.role === "assistant")?.text.trim();
  $("#peek-msgs").innerHTML = hist.length ? hist.map((m) => `<div class="msg ${m.role}">${m.role === "user" ? esc(m.text) : render(m.text)}</div>`).join("") : '<div class="hint">这段对话还没有消息。</div>';
  peekStream = null;
  if (keep && keep.dataset.raw.trim() && keep.dataset.raw.trim() !== lastA && live[path]) { $("#peek-msgs").appendChild(keep); peekStream = keep; }
  if (expect && expect.trim() !== lastA && !(keep && keep.dataset.raw.trim() === expect.trim())) $("#peek-msgs").insertAdjacentHTML("beforeend", `<div class="msg assistant">${render(expect)}</div>`);
  if (atBottom || !log.dataset.seen) log.scrollTop = log.scrollHeight;
  log.dataset.seen = "1";
}
async function sendPeek() {
  const t = $("#peek-input"), text = t.value.trim();
  if (!text || !peek) return;
  t.value = "";
  $("#peek-msgs").insertAdjacentHTML("beforeend", `<div class="msg user">${esc(text)}</div>`);
  $("#peek-log").scrollTop = $("#peek-log").scrollHeight;
  const r = await fetch("/api/send", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ path: peek, text }) });
  if (!r.ok) $("#peek-msgs").insertAdjacentHTML("beforeend", `<div class="msg assistant">${esc("出错了：" + (await r.json()).error)}</div>`);
}
$("#peek-close").onclick = closePeek;
$("#peek-send").onclick = sendPeek;
$("#peek-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendPeek(); }
  if (e.key === "Escape") closePeek();
});

// 左栏里的小输入框：回车确定，Esc 或点别处取消
function inlineInput(after, cls, placeholder, onEnter) {
  if (after.parentElement.querySelector("." + cls)) return;
  const input = document.createElement("input");
  input.className = cls;
  input.placeholder = placeholder;
  after.after(input);
  input.focus();
  input.onkeydown = async (e) => {
    if (e.key === "Escape") return input.remove();
    if (e.key !== "Enter" || e.isComposing || !input.value.trim()) return;
    const err = await onEnter(input.value.trim());
    if (err) { input.value = ""; input.placeholder = err; } else input.remove();
  };
  input.onblur = () => setTimeout(() => input.remove(), 150);
}

function newSession(agent, btn) {
  inlineInput(btn.closest(".bao-head"), "new-input", "对话名字，回车确定", async (name) => {
    const r = await fetch("/api/new", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ agent, name }) });
    const data = await r.json();
    if (!r.ok) return data.error;
    await loadTree();
    openPeek(data.path, true); // 新讨论串在右边打开，主对话留在中间
  });
}

// 新建宝：弹一个小窗，填名字（必填）、负责什么、挑个头像；建好直接进它的主对话
const FACES = ["", "💼", "🏠", "📚", "💰", "🏃", "🍳", "✈️", "🎨", "💻", "❤️", "🌱"]; // "" = 名字首字
function newBao() {
  const box = $("#newbao"), f = box.querySelector("form"), faces = box.querySelector(".faces"), err = box.querySelector(".err");
  let face = "";
  const drawFaces = () => {
    const nm = f.name.value.trim() || "宝";
    faces.innerHTML = FACES.map((e) => `<button type="button" data-face="${e}" class="${e === face ? "on" : ""}${e ? "" : " letter"}" ${e ? "" : `style="background:${color(nm)}"`} aria-label="${e ? `头像 ${e}` : "用名字首字"}">${e || esc([...nm][0].toUpperCase())}</button>`).join("")
      + `<input data-own maxlength="8" placeholder="自己填" aria-label="自己填一个 emoji" value="${FACES.includes(face) ? "" : esc(face)}">`;
  };
  f.reset(); err.textContent = ""; drawFaces();
  box.hidden = false;
  const last = document.activeElement;
  f.name.focus();
  const close = () => { box.hidden = true; box.onkeydown = f.onsubmit = faces.onclick = faces.oninput = f.name.oninput = box.onclick = null; last?.focus?.(); };
  f.name.oninput = () => { if (!face) faces.querySelector(".letter").textContent = [...(f.name.value.trim() || "宝")][0].toUpperCase(), faces.querySelector(".letter").style.background = color(f.name.value.trim() || "宝"); };
  faces.onclick = (e) => { const b = e.target.closest("[data-face]"); if (!b) return; face = b.dataset.face; drawFaces(); };
  faces.oninput = (e) => { if (!e.target.matches("[data-own]")) return; face = e.target.value.trim(); faces.querySelectorAll("[data-face]").forEach((b) => b.classList.toggle("on", b.dataset.face === face)); };
  box.querySelector(".cancel").onclick = close;
  box.onclick = (e) => { if (e.target === box) close(); };
  box.onkeydown = (e) => {
    if (e.key === "Escape") { e.stopPropagation(); close(); }
    if (e.key === "Enter" && e.target === f.about && !e.shiftKey && !e.isComposing) { e.preventDefault(); f.requestSubmit(); }
  };
  f.onsubmit = async (e) => {
    e.preventDefault();
    const name = f.name.value.trim(), btn = f.querySelector(".primary");
    if (!name) return f.name.focus();
    btn.disabled = true; err.textContent = "";
    try {
      const r = await fetch("/api/settings/agent", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name, create: true, about: f.about.value.trim(), emoji: face }) });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) { err.textContent = data.error || "没建成，再试一次"; return; }
      close();
      await loadTree();
      await openBao(name); // 直接进新宝的主对话
    } catch { err.textContent = "连不上 Kiki，再试一次"; }
    finally { btn.disabled = false; }
  };
}

async function loadTree() {
  tree = await (await fetch("/api/tree")).json();
  syncLive();
  renderSide();
}

function autosize() {
  const t = $("#input");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 200) + "px";
}

// 右栏开关：宽屏默认开、记住选择；窄屏点了才滑出来
function togglePanel() {
  if (matchMedia("(max-width: 1100px)").matches) return document.body.classList.toggle("show-panel");
  const off = document.body.classList.toggle("no-panel");
  try { localStorage.setItem("kiki.panel", off ? "off" : "on"); } catch {}
}
try { if (localStorage.getItem("kiki.panel") === "off") document.body.classList.add("no-panel"); } catch {}

// Kiki.app 的窗口没有标题栏：顶部 28px 和聊天标题这一行的空白处，按住能拖动窗口、双击放大
if (document.documentElement.classList.contains("kiki-fullsize")) {
  const winMsg = (m) => { try { window.webkit.messageHandlers.kikiWindow.postMessage(m); } catch {} };
  const dragZone = (e) => e.button === 0 && (e.clientY < 28 || e.target.closest("header"))
    && !e.target.closest("button, a, input, textarea, select, [data-path], [data-bao], [data-thread], #sheet, #newbao");
  document.addEventListener("mousedown", (e) => { if (e.detail === 1 && dragZone(e)) winMsg("drag"); });
  document.addEventListener("dblclick", (e) => { if (dragZone(e)) winMsg("zoom"); });
}

// 设置：弹窗打开，不离开聊天页
function openSettings(pane) {
  const sh = $("#sheet"), fr = $("#sheet-frame");
  // 每次打开都重新载入，显示最新的设置；pane 指定先打开哪一块（比如 baos）
  fr.src = "/settings.html?embed=1&t=" + Date.now() + (typeof pane === "string" && pane ? "#" + pane : "");
  sh.hidden = false;

}
function closeSettings() {
  const sh = $("#sheet");
  if (sh.hidden) return;
  sh.classList.remove("on");

  for (const k in aboutCache) delete aboutCache[k]; // 说明可能刚改过
  loadTree();

}
window.kikiCloseSettings = closeSettings; // 弹窗里的页面按 Esc 时调用
window.kikiOpenSettings = openSettings; // Kiki.app 菜单「设置…」（⌘,）调用
$("#sheet-close").onclick = closeSettings;
$("#sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") closeSettings(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("#sheet").hidden) { e.preventDefault(); closeSettings(); }
  if (e.key === "," && (e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey) { e.preventDefault(); openSettings(); }

document.body.addEventListener("click", (e) => {
  const dc = e.target.closest("[data-decide]");
  if (dc) return decide(dc.dataset.id, dc.dataset.decide);
  const st = e.target.closest("[data-settings]");
  if (st && !e.metaKey && !e.ctrlKey && !e.shiftKey) { e.preventDefault(); return openSettings(st.dataset.settings); }
  const th = e.target.closest("[data-thread]");
  if (th) return openPeek(th.dataset.thread, true);
  const nb = e.target.closest("[data-new]");
  if (nb) return newSession(nb.dataset.new, nb);
  const bh = e.target.closest("[data-bao]");
  if (bh) return openBao(bh.dataset.bao);
  const pk = e.target.closest("[data-peek]");
  if (pk) { e.preventDefault(); return openPeek(pk.dataset.peek); }
  const it = e.target.closest("[data-path]");
  if (it) return open(it.dataset.path);
  const go = e.target.closest("[data-goto]");
  if (go) {
    const [agent, ...rest] = go.dataset.goto.split("/");
    const s = tree.agents.find((a) => a.name === agent)?.sessions.find((x) => x.name === rest.join("/"));
    if (s) open(s.path);

  }
  const ch = e.target.closest("[data-choose]");

});
$("#add-bao").onclick = newBao;
$("aside").addEventListener("keydown", (e) => { const bh = e.target.closest?.("[data-bao]"); if (bh && e.target === bh && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openBao(bh.dataset.bao); } });
$("#panel-toggle").onclick = togglePanel;
$("#send").onclick = send;
const syncSend = () => { $("#send").disabled = !$("#input").value.trim(); };
$("#input").addEventListener("input", () => { autosize(); syncSend(); });
$("#input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});

const es = new EventSource("/api/events");
es.addEventListener("message", (e) => {
  const m = JSON.parse(e.data);
  if (m.path === peek) refreshPeek(m.role === "assistant" ? m.text : undefined);
  if (m.path === "main" && m.role === "assistant" && mainBusy) { mainBusy = false; live.main = null; thinkEyes(); }
  if (m.path === current && m.role === "assistant") finishLive();
  if (m.path !== current) { if (m.role === "assistant" && m.path !== peek) { unread.add(m.path); renderSide(); } return; }
  if (m.role === "assistant" && streaming) { streaming.innerHTML = render(m.text); streaming = null; lastStreamed = null; return; }
  if (m.role === "assistant" && lastStreamed && lastStreamed.dataset.raw.trim() === m.text.trim()) { lastStreamed.innerHTML = render(m.text); lastStreamed = null; return; }
  $(".hint")?.remove();
  addMsg(m.role, m.text);
  if (m.role === "user") lastStreamed = null;
  const p = $(".pending"); if (p) $("#msgs").appendChild(p); // 等待提示始终在最下面
});
es.addEventListener("delta", (e) => {
  const d = JSON.parse(e.data);
  if (d.path === peek) { // 右边打开的那段也跟着流式显示
    if (!peekStream) { peekStream = document.createElement("div"); peekStream.className = "msg assistant"; peekStream.dataset.raw = ""; $("#peek-msgs").appendChild(peekStream); }
    peekStream.dataset.raw += d.text;
    peekStream.innerHTML = md(peekStream.dataset.raw);
    $("#peek-log").scrollTop = $("#peek-log").scrollHeight;
  }
  if (d.path !== current) return;
  const atBottom = nearBottom();
  if (!streaming) {
    closeStepsBox(); // 工具做完开始说话了：上一组步骤折起来，话接在后面
    streaming = addMsg("assistant", ""); streaming.dataset.raw = "";
    const p = $(".pending"); if (p) $("#msgs").appendChild(p);
  }
  streaming.dataset.raw += d.text;
  streaming.innerHTML = md(streaming.dataset.raw);
  stickBottom(atBottom);
});
es.addEventListener("busy", (e) => {
  const d = JSON.parse(e.data);
  const s = find(d.path);
  if (s) { s.busy = d.busy; renderSide(); } else loadTree(); // 不认识的对话（比如刚交接出来的）就刷新左栏
  if (d.busy && !live[d.path]) live[d.path] = { since: Date.now(), status: "正在思考…", steps: [] };
  if (!d.busy) live[d.path] = null;
  if (!d.busy && d.path === peek) refreshPeek(); // 那段答完了，拿一遍完整记录
  if (d.path === current || (current === "main" && live.main?.follow === d.path)) renderLive();
});
// 进度：正在想 / 正在调用哪个工具 / 做过哪些步骤（服务端从 pi 的事件里来，见 src/agents.ts）
es.addEventListener("activity", (e) => {
  const d = JSON.parse(e.data);
  live[d.path] = d.live;
  const s = find(d.path);
  if (s) { s.live = d.live; renderPanel(); sideStatus(d.path); }
  if (d.path === current || (current === "main" && (d.path === "main" || live.main?.follow === d.path))) {
    if (d.live) renderLive(); else if (d.path === current) finishLive(); else renderLive();
  }
});

const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
const secs = (ms) => { const t = Math.max(0, Math.round(ms / 1000)); return t < 60 ? `${t} 秒` : `${Math.floor(t / 60)} 分 ${t % 60} 秒`; };
function stepLi(x) {
  const icon = x.status === "running" ? '<span class="spin"></span>' : x.status === "error" ? '<span class="bad">✕</span>' : '<span class="ok">✓</span>';
  const ms = x.ms != null && x.ms >= 1000 ? `<span class="ms">${secs(x.ms)}</span>` : "";
  return `<li>${icon}<span class="t">${esc(x.title)}</span>${x.detail ? `<span class="d" title="${esc(x.detail)}">${esc(x.detail)}</span>` : ""}${ms}</li>`;
}
function stepsSummary(steps, running) {
  if (running) return `正在做第 ${steps.length} 步`;
  const bad = steps.filter((x) => x.status === "error").length;
  return `用了 ${steps.length} 个工具${bad ? `，${bad} 个出错` : ""}`;
}
// 一组步骤的卡片；open=true 是正在做的（展开），否则折叠
function stepsBox(steps, open) {
  const box = document.createElement("details");
  box.className = "steps";
  box.open = open;
  box.innerHTML = `<summary>${CHEV}<span class="sum">${esc(stepsSummary(steps, open))}</span></summary><ol>${steps.map(stepLi).join("")}</ol>`;
  steps.forEach((x) => shown.add(x.id));
  return box;
}
// 当前对话（或奇奇正在等的那段对话）这一轮的进度
function liveOf(path) {
  if (path !== "main") return live[path] || null;
  const m = live.main;
  if (!m) return null;
  const f = m.follow ? live[m.follow] : null;
  const where = m.follow ? find(m.follow) : null;
  const who = where ? `${where.agent} › ${where.name}：` : "";
  return { since: m.since, status: f ? who + f.status : m.status, steps: f ? f.steps : [], follow: m.follow };
}
// 在改内容之前先看一眼是不是在最下面；是的话改完再滚到底（内容一下长很多也照样跟着）
function nearBottom() {
  const log = $("#log");
  return log.scrollHeight - log.scrollTop - log.clientHeight < 160;
}
function stickBottom(was) {
  if (was) $("#log").scrollTop = $("#log").scrollHeight;
}
function renderLive() {
  const l = liveOf(current);
  if (!l) return finishLive();
  const atBottom = nearBottom();
  // 正在做的这一组步骤（已经画过的不再画）
  const fresh = (l.steps || []).filter((x) => !shown.has(x.id) || $("#live-steps")?.dataset.ids?.split(",").includes(x.id));
  let box = $("#live-steps");
  if (fresh.length) {
    if (!box) {
      box = document.createElement("details");
      box.id = "live-steps"; box.className = "steps"; box.open = true;
      box.innerHTML = `<summary>${CHEV}<span class="sum"></span></summary><ol></ol>`;
      $("#msgs").appendChild(box);
      if (streaming) { lastStreamed = streaming; streaming = null; } // 先说的话留在上面，后面的话接在步骤下面
    }
    box.dataset.ids = fresh.map((x) => x.id).join(",");
    fresh.forEach((x) => shown.add(x.id));
    box.querySelector(".sum").textContent = stepsSummary(fresh, true);
    box.querySelector("ol").innerHTML = fresh.map(stepLi).join("");
  }
  // 最下面一行：转圈 + 现在在干嘛 + 过了多久
  let line = $(".pending");
  if (!line) { line = document.createElement("div"); line.className = "msg pending"; line.setAttribute("aria-live", "polite"); }
  const waiting = asks.some((a) => a.path === (l.follow || current));
  line.innerHTML = `<span class="spin"></span><span class="what">${esc(waiting ? "等你点头：看下面的卡片" : l.status)}</span><span class="elapsed" data-since="${l.since}">· ${secs(Date.now() - l.since)}</span>`;
  $("#msgs").appendChild(line);
  $(".hint")?.remove();
  stickBottom(atBottom);
}
// 收起正在做的这组步骤：改成“用了 N 个工具”，折叠
function closeStepsBox() {
  const box = $("#live-steps");
  if (!box) return;
  box.removeAttribute("id");
  box.open = false;
  const n = box.querySelectorAll("li").length, bad = box.querySelectorAll(".bad").length;
  box.querySelector(".sum").textContent = `用了 ${n} 个工具${bad ? `，${bad} 个出错` : ""}`;
  box.querySelectorAll("li .spin").forEach((sp) => sp.outerHTML = '<span class="ok">✓</span>');
}
function finishLive() {
  $(".pending")?.remove();
  closeStepsBox();
}
// 每秒刷新"过了多久"
setInterval(() => document.querySelectorAll(".elapsed").forEach((el) => el.textContent = `· ${secs(Date.now() - Number(el.dataset.since))}`), 1000);
// 左栏转圈的地方悬停能看到在干嘛
function sideStatus(path) {
  const s = find(path);
  const btn = [...document.querySelectorAll("aside .sess")].find((b) => b.dataset.thread === path);
  if (btn) btn.title = s?.live?.status || "";
}
es.addEventListener("tree", (e) => { tree = JSON.parse(e.data); syncLive(); renderSide(); });
// 从列表里同步进度（刷新页面、重连、打开一段已经在干活的对话时用）
function syncLive() {
  if (tree.main !== undefined) live.main = tree.main || (mainBusy ? live.main : null);
  for (const a of tree.agents) for (const s of a.sessions) live[s.path] = s.live || (s.busy ? live[s.path] : null);
}
es.addEventListener("approvals", (e) => { asks = JSON.parse(e.data); renderSide(); if (liveOf(current)) renderLive(); });

// 更新提示：只在有新版本、正在装、出错或回滚时出现；平时不显示
function renderUpdate(u) {
  const el = $("#upd");
  if (!u) return;
  if (u.status === "available")
    el.innerHTML = u.canApply ? `新版本 v${esc(u.latest)} <button id="upd-go">更新</button>` : `新版本 v${esc(u.latest)}（git pull 更新）`;
  else if (u.status === "downloading" || u.status === "installing") el.textContent = ""; // 进度在弹窗里显示
  else if (u.status === "error") el.innerHTML = `<span title="${esc(u.message || "")}">更新出错</span>`;
  else if (u.last && u.last.result === "rolled_back" && u.last.from === u.current) el.textContent = `v${u.last.to} 没起来，已回滚`;
  else el.textContent = "";
  const go = $("#upd-go");
  if (go) go.onclick = () => { showUpdating({ ...u, status: "downloading", step: { n: 1, of: 6, label: "准备下载", percent: 0 } }); fetch("/api/update/apply", { method: "POST" }); };
  showUpdating(u);
}
// 更新弹窗：下载、校验、自检、备份、等对话、切换重启 6 步
let updatingFrom = null;
function showUpdating(u) {
  const box = $("#updating");
  const busy = u && (u.status === "downloading" || u.status === "installing");
  if (!busy) { if (!restarting) box.hidden = true; return; }
  box.hidden = false;
  updatingFrom = u.current;
  $("#updating-ver").textContent = u.latest ? `v${u.current} → v${u.latest}` : "";
  const st = u.step;
  $("#updating-bar").value = st ? Math.round(((st.n - 1) + (st.percent ?? 0) / 100) / st.of * 100) : 0;
  $("#updating-step").textContent = st ? `第 ${st.n}/${st.of} 步：${st.label}${st.n === 1 && st.percent !== undefined ? ` · ${st.percent}%` : ""}` : (u.message || "准备中…");
}
// 切换时 Kiki 会重启几秒，事件流断开：弹窗里说明正在重启，重新连上后版本变了就整页刷新
let restarting = false;
es.addEventListener("error", () => {
  if ($("#updating").hidden) return;
  restarting = true;
  $("#updating-bar").value = 95;
  $("#updating-step").textContent = "正在重启 Kiki，马上就好…";
});
es.addEventListener("update", (e) => renderUpdate(JSON.parse(e.data)));
// 每次（重新）连上都刷新一下；Kiki 更新重启后版本号变了，就整页重载，用上新网页
let seenVersion = null;
es.addEventListener("open", () => { loadAsks(); return fetch("/api/update").then((r) => r.ok && r.json()).then((u) => {
    if (!u) return;
    if (seenVersion && seenVersion !== u.current) return location.reload();
    seenVersion = u.current;
    restarting = false; // 重新连上了（版本没变说明没换成功，弹窗关掉，看设置页的详情）
    renderUpdate(u);
  }).catch(() => {}); });

loadTree().then(() => open("main"));

// 奇奇的头像换成会动的版本；加载失败就留着静态图
let eyes = null, mainBusy = false;
import("/qiqi-eyes.js").then((m) => { eyes = m.mountQiqi($(".kiki .ava")); thinkEyes(); }).catch(() => {});
// 有对话在干活（包括奇奇自己在分派）时，奇奇抬头看星星
function thinkEyes() {
  eyes?.think(mainBusy || tree.agents.some((a) => a.sessions.some((s) => s.busy)));
}
</script>
</body>
</html>
