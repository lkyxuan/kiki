# 发布：改 package.json 里的版本号并合进 main（或者在 Actions 页面手动运行）。
# 私有仓库不在这里打包（私有仓库用 GitHub 的 Mac 要按 10 倍扣费），而是通知公开的 lkyxuan/kiki，
# 由它用公开仓库免费的 Mac 拉这个提交的代码打包、签名、发版（见 build-from-pro.yml）。
# 安装包发在 lkyxuan/kiki 的 Releases，已装的 Kiki 一直从那里更新。这个版本已经发过就跳过。
# 需要 Secret KIKI_PUBLIC_TOKEN：能操作 lkyxuan/kiki 的令牌（repo 权限，或 Fine-grained 的 Contents + Workflows 读写）。
name: release
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
env:
  PUBLIC_REPO: lkyxuan/kiki
jobs:
  release:
    if: github.repository != 'lkyxuan/kiki'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 通知公开仓库打包发版
        env:
          GH_TOKEN: ${{ secrets.KIKI_PUBLIC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::没配 KIKI_PUBLIC_TOKEN，通知不了 $PUBLIC_REPO，这次跳过"; exit 0; fi
          v=$(node -p 'require("./package.json").version')
          if gh release view "v$v" -R "$PUBLIC_REPO" >/dev/null 2>&1; then echo "v$v 已经发过，跳过"; exit 0; fi
          gh api "repos/$PUBLIC_REPO/dispatches" -f event_type=kiki-release -f "client_payload[sha]=$GITHUB_SHA" -f "client_payload[version]=$v"
          echo "已通知 $PUBLIC_REPO 打包 v$v（提交 $GITHUB_SHA），进度看 https://github.com/$PUBLIC_REPO/actions/workflows/build-from-pro.yml"
