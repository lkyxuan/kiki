# 代工打包（只在公开仓库 lkyxuan/kiki 里跑）：私有仓库 cyberight-cap/kiki-pro 改了版本号合进 main 后，
# 它的 release 工作流会发一个 kiki-release 信号过来（带上提交号），这里用公开仓库免费的 Mac
# 把那个提交的代码临时拉下来 → 检查 → 测试 → 打包签名公证 → 发到本仓库的 Releases。代码不进本仓库，机器用完即毁。
# 装好的 Kiki 会在一小时内发现新版本，空闲时自动装上。.dmg 给第一次安装用，自动更新用 .zip。
# 发完再把同一份文件传到 Cloudflare R2（dl.kikibao.com），国内下载不断；已装的 Kiki 先从那里下，不通再回 GitHub。
# 需要的 Secrets（都在 lkyxuan/kiki）：KIKI_PRO_TOKEN（能读 kiki-pro 的令牌）+ 签名公证那 5 个
#   + R2_ACCOUNT_ID、R2_ACCESS_KEY_ID、R2_SECRET_ACCESS_KEY（可选 R2_BUCKET，默认 kiki-releases）。没配 R2 就只发 GitHub。
# 也可以在 Actions 页面手动运行，填 kiki-pro 的提交号或分支名；
# 填了「只同步到 R2」就不打包，把 GitHub 上已经发过的那个版本原样传到 R2（第一次配好 R2 时补传用）。
name: build-from-pro
on:
  repository_dispatch:
    types: [kiki-release]
  workflow_dispatch:
    inputs:
      ref:
        description: kiki-pro 的提交号或分支名
        default: main
      mirror_tag:
        description: 只同步到 R2：填已经发过的版本（比如 v0.3.7），不打包。留空就正常打包发版
        default: ""
permissions:
  contents: write
concurrency:
  group: build-from-pro
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'lkyxuan/kiki'
    runs-on: macos-latest   # 原生窗口要用 Mac 编译（公开仓库免费）
    env:
      GH_REPO: ${{ github.repository }}   # 工作目录是私有仓库的代码，gh 默认会认成 kiki-pro，这里固定成本仓库
    steps:
      - name: 拉私有仓库的代码
        uses: actions/checkout@v4
        with:
          repository: cyberight-cap/kiki-pro
          ref: ${{ github.event.client_payload.sha || inputs.ref || 'main' }}
          token: ${{ secrets.KIKI_PRO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 这个版本发过没有
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_TAG: ${{ inputs.mirror_tag }}
        run: |
          if [ -n "$MIRROR_TAG" ]; then
            [[ "$MIRROR_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "版本要写成 v0.3.7 这样"; exit 1; }
            echo "tag=$MIRROR_TAG" >> "$GITHUB_OUTPUT"
            echo "只把 $MIRROR_TAG 同步到 R2"; echo "skip=1" >> "$GITHUB_OUTPUT"; echo "mirror_only=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          v=$(node -p 'require("./package.json").version')
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "v$v 已经发过，跳过"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.ver.outputs.skip != '1'
        run: npm ci
      - if: steps.ver.outputs.skip != '1'
        run: npm run check && npm test
      # 苹果签名和公证：仓库 Secrets 里配了证书才做，没配就和以前一样只做本地签名。步骤见 docs/signing.md
      - name: 导入开发者证书
        id: sign
        if: steps.ver.outputs.skip != '1'
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$P12" ]; then echo "没配 MACOS_CERT_P12，这一版不签名"; exit 0; fi
          KC="$RUNNER_TEMP/kiki-signing.keychain-db"
          KCPW=$(openssl rand -hex 16)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -1)
          [ -n "$ID" ] || { echo "证书里没有 Developer ID Application（是不是导出成了别的证书？）"; exit 1; }
          echo "签名身份：$ID"
          echo "KIKI_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          echo "signed=1" >> "$GITHUB_OUTPUT"
          if [ -n "$ASC_KEY_P8" ]; then
            printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi
      - if: steps.ver.outputs.skip != '1'
        env:
          NOTARY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/build.sh arm64 && packaging/build.sh x64
      - name: 看看 .dmg 能不能直接打开（公证过的才算）
        if: steps.ver.outputs.skip != '1' && steps.sign.outputs.signed == '1'
        id: gate
        run: |
          if spctl -a -t open --context context:primary-signature -vv out/Kiki-*mac-arm64.dmg; then
            echo "notarized=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::签了名但没有公证（没配公证密钥？），别人第一次打开仍会被拦"
          fi
      - name: 建 Release
        if: steps.ver.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          NOTARIZED: ${{ steps.gate.outputs.notarized }}
        run: |
          if [ "$NOTARIZED" = 1 ]; then
            cat > notes.md <<'EOF'
          ## 安装
          - **下载 .dmg**：Apple 芯片选名字里带 `arm64` 的（比如 `Kiki-0.3.28-mac-arm64.dmg`），Intel 选带 `x64` 的。打开后把 Kiki 拖进「应用程序」，双击就能用（已通过苹果公证）。
            国内下载慢可以用镜像：[Apple 芯片](https://dl.kikibao.com/latest/Kiki-mac-arm64.dmg) · [Intel](https://dl.kikibao.com/latest/Kiki-mac-x64.dmg)
          - 或者在「终端」里运行一行：`curl -fsSL https://dl.kikibao.com/install.sh | bash`
            （从 GitHub 拿：`curl -fsSL https://raw.githubusercontent.com/lkyxuan/kiki/main/packaging/install.sh | bash`）
          - 已经装过的 Kiki 会自己更新（每小时检查一次），不用重新下载。
          EOF
          else
          cat > notes.md <<'EOF'
          ## 安装
          - **推荐**：在「终端」里运行一行（自动下载、核对、装好、启动，不会被系统拦）：
            `curl -fsSL https://dl.kikibao.com/install.sh | bash`
            （从 GitHub 拿：`curl -fsSL https://raw.githubusercontent.com/lkyxuan/kiki/main/packaging/install.sh | bash`）
          - **或者下载 .dmg**：Apple 芯片选名字里带 `arm64` 的（比如 `Kiki-0.3.28-mac-arm64.dmg`），Intel 选带 `x64` 的。打开后把 Kiki 拖进「应用程序」。
            Kiki 还没有苹果开发者签名，第一次打开会提示「无法验证开发者」：到「系统设置 → 隐私与安全性」最下面点「仍要打开」，
            或者在终端运行 `xattr -dr com.apple.quarantine /Applications/Kiki.app`。
          - 已经装过的 Kiki 会自己更新（每小时检查一次），不用重新下载。
          EOF
          fi
          # tag 打在本仓库 main 上（私有仓库的提交这里没有）；不自动生成更新说明，免得列出私有仓库的提交
          # .dmg 名字带版本号（Kiki-0.3.28-mac-arm64.dmg）；通配符也认更早的旧名字 Kiki-mac-arm64.dmg
          gh release create "$TAG" out/Kiki-*mac-arm64.dmg out/Kiki-*mac-x64.dmg out/Kiki-mac-arm64.zip out/Kiki-mac-x64.zip out/SHA256SUMS \
            --title "Kiki $TAG" --notes-file notes.md
      - name: 取已经发过的安装包（只同步到 R2 时）
        if: steps.ver.outputs.mirror_only == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          mkdir -p out
          gh release download "$TAG" -D out --clobber -p 'Kiki-*' -p SHA256SUMS
          ls -l out
      # 传到 Cloudflare R2（dl.kikibao.com）。没配 R2 的 Secrets 就跳过，只发 GitHub；配了但传失败，这一步标红
      - name: 同步到 Cloudflare R2
        if: steps.ver.outputs.skip != '1' || steps.ver.outputs.mirror_only == '1'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "::warning::没配 R2 的 Secrets，这一版只发在 GitHub（配法见 docs/download-mirror.md）"; exit 0
          fi
          if [ ! -f packaging/r2-upload.sh ]; then echo "::warning::这个提交里还没有 packaging/r2-upload.sh，跳过 R2"; exit 0; fi
          bash packaging/r2-upload.sh out "$TAG"
      - name: 清掉临时钥匙串
        if: always() && steps.sign.outputs.signed == '1'
        run: security delete-keychain "$RUNNER_TEMP/kiki-signing.keychain-db" || true; rm -f "$RUNNER_TEMP/AuthKey.p8"
