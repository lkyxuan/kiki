# Release build (runs only in the public repo lkyxuan/kiki). When a version bump lands on main in the
# private source repo, its release workflow sends a kiki-release dispatch here with the commit SHA.
# This job checks out that commit on a free macOS runner -> type check -> tests -> build, sign, notarize
# -> publish to this repo's Releases. Source code is never committed here; the runner is discarded afterwards.
# Installed copies of Kiki pick up the new version within an hour and update when idle.
# The .dmg is for first installs; the .zip is for auto-update.
# The same files are then mirrored to Cloudflare R2 (dl.kikibao.com). Kiki tries the mirror first, then GitHub.
# Secrets (all in lkyxuan/kiki): KIKI_PRO_TOKEN (read access to the source repo) + the 5 signing/notarization secrets
#   + R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (optional R2_BUCKET, default kiki-releases). Without R2, publish to GitHub only.
# Can also be run by hand from the Actions tab with a source commit SHA or branch.
# With "mirror_tag" set, nothing is built: an already published release is copied to R2 as-is (backfill).
name: build-from-pro
# The run title carries the version; the release watchdog matches runs to versions by it
run-name: Build ${{ github.event.client_payload.version && format('v{0}', github.event.client_payload.version) || inputs.mirror_tag || inputs.ref }}
on:
  repository_dispatch:
    types: [kiki-release]
  workflow_dispatch:
    inputs:
      ref:
        description: Source commit SHA or branch
        default: main
      mirror_tag:
        description: Mirror only - an already published version (e.g. v0.3.7) to copy to R2 without building. Leave empty for a normal release
        default: ""
permissions:
  contents: write
concurrency:
  group: build-from-pro
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'lkyxuan/kiki'
    runs-on: macos-latest   # the native shell needs macOS to build (free for public repos)
    env:
      GH_REPO: ${{ github.repository }}   # the checkout is the source repo, so pin gh to this repo
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          repository: cyberight-cap/kiki-pro
          ref: ${{ github.event.client_payload.sha || inputs.ref || 'main' }}
          token: ${{ secrets.KIKI_PRO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Check whether this version is already out
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_TAG: ${{ inputs.mirror_tag }}
        run: |
          if [ -n "$MIRROR_TAG" ]; then
            [[ "$MIRROR_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must look like v0.3.7"; exit 1; }
            echo "tag=$MIRROR_TAG" >> "$GITHUB_OUTPUT"
            echo "Mirroring $MIRROR_TAG to R2 only"; echo "skip=1" >> "$GITHUB_OUTPUT"; echo "mirror_only=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          v=$(node -p 'require("./package.json").version')
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "v$v is already released, skipping"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.ver.outputs.skip != '1'
        run: npm ci
      - if: steps.ver.outputs.skip != '1'
        run: npm run check && npm test
      # Apple signing and notarization: only when the certificate secrets are set; otherwise ad-hoc signing
      - name: Import Developer ID certificate
        id: sign
        if: steps.ver.outputs.skip != '1'
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$P12" ]; then echo "MACOS_CERT_P12 is not set, building unsigned"; exit 0; fi
          KC="$RUNNER_TEMP/kiki-signing.keychain-db"
          KCPW=$(openssl rand -hex 16)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -1)
          [ -n "$ID" ] || { echo "No Developer ID Application identity in the certificate (exported the wrong one?)"; exit 1; }
          echo "Signing identity: $ID"
          echo "KIKI_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          echo "signed=1" >> "$GITHUB_OUTPUT"
          if [ -n "$ASC_KEY_P8" ]; then
            printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi
      - if: steps.ver.outputs.skip != '1'
        env:
          NOTARY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/build.sh arm64 && packaging/build.sh x64
      - name: Check the .dmg opens without warnings (notarized)
        if: steps.ver.outputs.skip != '1' && steps.sign.outputs.signed == '1'
        id: gate
        run: |
          if spctl -a -t open --context context:primary-signature -vv out/Kiki-*mac-arm64.dmg; then
            echo "notarized=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Signed but not notarized (missing notary key?). Gatekeeper will still block the first launch"
          fi
      - name: Create release
        if: steps.ver.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          NOTARIZED: ${{ steps.gate.outputs.notarized }}
        run: |
          if [ "$NOTARIZED" = 1 ]; then
            cat > notes.md <<'EOF'
          ## Install
          - **Download the .dmg**: pick `arm64` for Apple silicon (e.g. `Kiki-0.3.28-mac-arm64.dmg`) or `x64` for Intel. Open it and drag Kiki into Applications. Signed and notarized by Apple.
            Mirror (faster in mainland China): [Apple silicon](https://dl.kikibao.com/latest/Kiki-mac-arm64.dmg) · [Intel](https://dl.kikibao.com/latest/Kiki-mac-x64.dmg)
          - Or run one line in Terminal: `curl -fsSL https://dl.kikibao.com/install.sh | bash`
            (from GitHub: `curl -fsSL https://raw.githubusercontent.com/lkyxuan/kiki/main/packaging/install.sh | bash`)
          - Existing installs update themselves (checked hourly). No need to download again.
          EOF
          else
          cat > notes.md <<'EOF'
          ## Install
          - **Recommended**: run one line in Terminal (downloads, verifies, installs and launches; not blocked by Gatekeeper):
            `curl -fsSL https://dl.kikibao.com/install.sh | bash`
            (from GitHub: `curl -fsSL https://raw.githubusercontent.com/lkyxuan/kiki/main/packaging/install.sh | bash`)
          - **Or download the .dmg**: pick `arm64` for Apple silicon (e.g. `Kiki-0.3.28-mac-arm64.dmg`) or `x64` for Intel. Open it and drag Kiki into Applications.
            This build is not notarized, so macOS will say it cannot verify the developer on first launch: go to System Settings → Privacy & Security and click "Open Anyway",
            or run `xattr -dr com.apple.quarantine /Applications/Kiki.app` in Terminal.
          - Existing installs update themselves (checked hourly). No need to download again.
          EOF
          fi
          # The tag goes on this repo's main (source commits don't exist here); no auto-generated notes, so private commits are never listed
          # The .dmg name carries the version (Kiki-0.3.28-mac-arm64.dmg); the glob also matches the older Kiki-mac-arm64.dmg
          gh release create "$TAG" out/Kiki-*mac-arm64.dmg out/Kiki-*mac-x64.dmg out/Kiki-mac-arm64.zip out/Kiki-mac-x64.zip out/SHA256SUMS \
            --title "Kiki $TAG" --notes-file notes.md
      # AI data export helper app (packaging/banjia/): signed, notarized and attached to this release, then mirrored to R2. Failure here doesn't block the Kiki release
      - name: Build AI data export helper
        if: steps.ver.outputs.skip != '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          NOTARY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ ! -f packaging/banjia/build.sh ]; then echo "No data export helper in this commit, skipping"; exit 0; fi
          bash packaging/banjia/build.sh "$TAG"
          gh release upload "$TAG" out/AI-banjia-mac.zip --clobber
      - name: Download published assets (mirror only)
        if: steps.ver.outputs.mirror_only == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          mkdir -p out
          gh release download "$TAG" -D out --clobber -p 'Kiki-*' -p SHA256SUMS
          ls -l out
      # Mirror to Cloudflare R2 (dl.kikibao.com). Skipped without R2 secrets; fails red if configured but the upload fails
      - name: Mirror to Cloudflare R2
        if: steps.ver.outputs.skip != '1' || steps.ver.outputs.mirror_only == '1'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "::warning::R2 secrets are not set, this release is on GitHub only"; exit 0
          fi
          if [ ! -f packaging/r2-upload.sh ]; then echo "::warning::No packaging/r2-upload.sh in this commit, skipping R2"; exit 0; fi
          bash packaging/r2-upload.sh out "$TAG"
      - name: Remove temporary keychain
        if: always() && steps.sign.outputs.signed == '1'
        run: security delete-keychain "$RUNNER_TEMP/kiki-signing.keychain-db" || true; rm -f "$RUNNER_TEMP/AuthKey.p8"
